<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-EMOJI ULTIMATE ONLINE (OTIMIZADO)</title>
    <style>
        :root { --p-color: #00ff00; }
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-font-smoothing: antialiased; }
        
        /* Otimização de GPU */
        #game-world, .entity, .bullet { will-change: transform; transform: translate3d(0,0,0); backface-visibility: hidden; }

        /* Telas de Menu */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: 0.3s; }
        input { padding: 12px; margin: 10px; border-radius: 5px; border: 1px solid var(--p-color); background: #222; color: #fff; width: 250px; text-align: center; font-size: 16px; }
        button { padding: 12px 25px; margin: 5px; cursor: pointer; background: var(--p-color); border: none; font-weight: bold; border-radius: 5px; width: 275px; color: #000; font-size: 16px; }
        button:active { transform: scale(0.95); }

        /* Jogo */
        #game-world { position: absolute; width: 3000px; height: 3000px; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transform-origin: 0 0; }
        
        /* Entidades */
        .entity { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; top: 0; left: 0; margin-left: -20px; margin-top: -20px; }
        .player-label { position: absolute; top: -20px; font-size: 10px; white-space: nowrap; color: #0f0; width: 100%; text-align: center; text-shadow: 1px 1px #000; }
        
        /* Destaque para o PRÓPRIO player */
        .me .player-label { color: #ffff00; font-weight: bold; }
        .me { filter: drop-shadow(0 0 5px #ffff00); z-index: 50; }

        /* UI */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; pointer-events: none; text-shadow: 2px 2px #000; }
        .stat-box { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid var(--p-color); margin-bottom: 5px; border-radius: 0 5px 5px 0; font-weight: bold; }
        
        /* Chat */
        #chat-area { position: fixed; bottom: 180px; left: 20px; width: 300px; z-index: 500; pointer-events: auto; }
        #chat-log { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; display: flex; flex-direction: column-reverse; font-size: 12px; }
        #chat-input { width: 100%; box-sizing: border-box; background: rgba(50,50,50,0.8); border: 1px solid #555; padding: 8px; color: #fff; border-radius: 5px; }

        /* Joysticks */
        .joy-container { position: fixed; bottom: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; z-index: 900; }
        #move-joy { left: 20px; }
        #shoot-joy { right: 20px; border-color: rgba(255,50,50,0.3); }
        .stick { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; top: 35px; left: 35px; pointer-events: none; transform: translate3d(0,0,0); }
        
        .bullet { position: absolute; font-size: 15px; z-index: 10; pointer-events: none; margin-left: -7px; margin-top: -7px; }
        .xp-bar-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #222; z-index: 999; }
        #xp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffcc00, #ff0000); transition: width 0.3s; }
    </style>
</head>
<body>

<div class="xp-bar-container"><div id="xp-bar-fill"></div></div>

<div id="menu-screen" class="overlay">
    <h1 style="font-size: 2.5em; color: var(--p-color); text-shadow: 0 0 10px var(--p-color);">🧟 Z-EMOJI ULTIMATE</h1>
    <input type="text" id="player-name" placeholder="Seu Apelido" maxlength="10">
    <button onclick="initGame('public')">ENTRAR RÁPIDO</button>
    <button onclick="showPrivateMenu()" style="background:#555">SALA PRIVADA</button>
</div>

<div id="private-menu" class="overlay" style="display:none">
    <h2>SALA PRIVADA</h2>
    <input type="text" id="room-code" placeholder="Código da Sala">
    <button onclick="initGame('create-private')">CRIAR SALA</button>
    <button onclick="initGame('join-private')">ENTRAR NA SALA</button>
    <button onclick="backToMenu()" style="background:#444">VOLTAR</button>
</div>

<div id="lobby-screen" class="overlay" style="display:none">
    <h2 id="lobby-status">Aguardando...</h2>
    <div style="font-size: 40px; margin: 20px; color: #ffcc00;" id="timer-display">Wait</div>
    <p id="room-id-tag" style="font-family: monospace; background: #333; padding: 5px;"></p>
</div>

<div id="hud">
    <div class="stat-box">
        <div id="gun-display">👊 Soco Nv.1</div>
        <div id="kill-display">Kills: 0</div>
    </div>
    <div class="stat-box">
        <div id="hp-display">❤️❤️❤️</div>
    </div>
</div>

<div id="chat-area">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Enter para chat...">
</div>

<div id="game-world">
    <div id="entities-layer"></div>
</div>

<div id="move-joy" class="joy-container"><div class="stick" id="move-stick"></div></div>
<div id="shoot-joy" class="joy-container"><div class="stick" id="shoot-stick"></div></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, push, update, onDisconnect, remove, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
        authDomain: "chatrucoy.firebaseapp.com",
        databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
        projectId: "chatrucoy"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- DADOS ---
    const WEAPONS = [
        {n: "👊 Soco", d: 1, s: 300}, {n: "🔪 Faca", d: 2, s: 300}, {n: "🔫 Glock", d: 3, s: 500},
        {n: "🪓 Machado", d: 5, s: 600}, {n: "🔫 Uzi", d: 2, s: 150}, {n: "🔫 Ak-47", d: 6, s: 200},
        {n: "🏹 Arco", d: 8, s: 600}, {n: "💣 Granada", d: 25, s: 1000}, {n: "⚡ Laser", d: 5, s: 100},
        {n: "🔱 Tridente", d: 15, s: 800}, {n: "⚔️ Katana", d: 12, s: 400}, {n: "☄️ Meteoro", d: 50, s: 2000}
    ];

    const ZOMBIE_TYPES = ["🧟", "🧟‍♂️", "🧟‍♀️", "💀", "👻", "👹", "👽", "🤖"];

    // --- ESTADO ---
    let myId = "P_" + Math.random().toString(36).substr(2, 5);
    let roomID = "";
    let isHost = false;
    let gameState = 'MENU';
    
    // Objeto do Player Local
    let myData = {
        x: 1500, y: 1500, hp: 5, kills: 0, 
        weaponIdx: 0, nick: "Noob", color: "#fff",
        vx: 0, vy: 0
    };
    
    // Cache de Entidades
    let players = {};
    let zombies = {};
    let items = {};
    let bullets = [];
    
    // Controle de Loop
    let lastShootTime = 0;
    let lastSyncTime = 0;
    const SYNC_RATE = 100; // Envia dados a cada 100ms (reduz lag)

    // --- CAMERA E RENDERIZAÇÃO ---
    const gameWorld = document.getElementById('game-world');
    const entitiesLayer = document.getElementById('entities-layer');

    function updateCamera() {
        // Centraliza usando translate3d para GPU
        const cx = window.innerWidth / 2 - myData.x;
        const cy = window.innerHeight / 2 - myData.y;
        gameWorld.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
    }

    // --- LOGICA DE JOGO ---
    window.initGame = async (mode) => {
        const nickInput = document.getElementById('player-name').value;
        myData.nick = nickInput ? nickInput.substring(0,10) : "Survivor";
        
        if(mode === 'public') roomID = "PUB_v2"; 
        else if(mode === 'create-private') roomID = "PRIV_" + Math.random().toString(36).substr(2,4).toUpperCase();
        else roomID = document.getElementById('room-code').value.toUpperCase();

        document.querySelectorAll('.overlay').forEach(e => e.style.display = 'none');
        document.getElementById('lobby-screen').style.display = 'flex';
        document.getElementById('room-id-tag').innerText = "SALA: " + roomID;
        
        joinFirebaseRoom();
    };

    function joinFirebaseRoom() {
        const roomRef = ref(db, `rooms/${roomID}`);
        
        get(ref(db, `rooms/${roomID}/host`)).then(snap => {
            if(!snap.exists()) {
                set(ref(db, `rooms/${roomID}/host`), myId);
                isHost = true;
                startLobbyTimer();
            } else {
                // Verificar se a partida já começou
                get(ref(db, `rooms/${roomID}/status`)).then(s => {
                    if(s.val() === 'STARTED') startGame();
                });
            }
        });

        // Registrar e limpar ao sair
        set(ref(db, `rooms/${roomID}/players/${myId}`), myData);
        onDisconnect(ref(db, `rooms/${roomID}/players/${myId}`)).remove();

        // Listeners Otimizados (apenas atualizam dados locais)
        onValue(ref(db, `rooms/${roomID}/status`), snap => {
            if(snap.val() === 'STARTED' && gameState !== 'PLAYING') startGame();
        });

        onValue(ref(db, `rooms/${roomID}/timer`), snap => {
            if(gameState === 'MENU') document.getElementById('timer-display').innerText = snap.val();
        });

        onValue(ref(db, `rooms/${roomID}/players`), snap => {
            players = snap.val() || {};
            // Não renderiza aqui, apenas atualiza dados. O loop desenha.
        });

        onValue(ref(db, `rooms/${roomID}/zombies`), snap => {
            zombies = snap.val() || {};
        });

        onValue(ref(db, `rooms/${roomID}/items`), snap => {
            items = snap.val() || {};
        });

        onValue(ref(db, `rooms/${roomID}/chat`), snap => updateChatUI(snap.val()));
    }

    function startLobbyTimer() {
        let count = 10;
        const itv = setInterval(() => {
            count--;
            update(ref(db, `rooms/${roomID}`), { timer: count });
            if(count <= 0) {
                clearInterval(itv);
                set(ref(db, `rooms/${roomID}/status`), 'STARTED');
            }
        }, 1000);
    }

    function startGame() {
        gameState = 'PLAYING';
        document.getElementById('lobby-screen').style.display = 'none';
        if(isHost) {
            spawnInitialZombies();
            setInterval(hostLogic, 1000); // IA roda a cada 1s
        }
        requestAnimationFrame(gameLoop);
    }

    // --- GAME LOOP (CORE) ---
    function gameLoop() {
        if(gameState !== 'PLAYING') return;

        // 1. Física Local
        if(myData.vx !== 0 || myData.vy !== 0) {
            myData.x += myData.vx * 6;
            myData.y += myData.vy * 6;
            // Limites
            myData.x = Math.max(50, Math.min(2950, myData.x));
            myData.y = Math.max(50, Math.min(2950, myData.y));
        }

        // 2. Sincronização com Firebase (Throttled)
        const now = Date.now();
        if(now - lastSyncTime > SYNC_RATE) {
            update(ref(db, `rooms/${roomID}/players/${myId}`), {
                x: Math.round(myData.x), 
                y: Math.round(myData.y),
                kills: myData.kills,
                weaponIdx: myData.weaponIdx
            });
            lastSyncTime = now;
        }

        // 3. Renderização e Lógica Visual
        updateCamera();
        processBullets();
        checkCollisions();
        renderEntities(); // Desenha tudo junto

        requestAnimationFrame(gameLoop);
    }

    // --- RENDERIZAÇÃO DOM OTIMIZADA ---
    function renderEntities() {
        // Render Players
        // Incluindo o próprio jogador na lista visual
        const allPlayers = {...players};
        allPlayers[myId] = myData; // Garante que eu existo na renderização

        renderGeneric(allPlayers, 'P');
        renderGeneric(zombies, 'Z');
        renderGeneric(items, 'I');
    }

    function renderGeneric(dataList, prefix) {
        // Marca elementos existentes
        const presentIds = new Set();

        Object.keys(dataList).forEach(id => {
            presentIds.add(id);
            let el = document.getElementById(id);
            const entity = dataList[id];

            if(!el) {
                el = document.createElement('div');
                el.id = id;
                el.className = 'entity';
                
                if(prefix === 'P') {
                    if(id === myId) el.classList.add('me'); // Classe especial para mim
                    el.innerHTML = `<div class="player-label">${entity.nick}</div>👤`;
                } else if(prefix === 'Z') {
                    el.innerText = entity.type;
                } else {
                    el.innerText = entity.type;
                    el.style.fontSize = "20px";
                }
                entitiesLayer.appendChild(el);
            }

            // Movimento suave via CSS transform
            el.style.transform = `translate3d(${entity.x}px, ${entity.y}px, 0)`;
        });

        // Limpeza de elementos removidos (Garbage Collection do DOM)
        // Isso deve rodar menos frequentemente em jogos muito pesados, mas aqui ok.
        const allInDom = document.querySelectorAll(`.entity[id^="${prefix}"]`);
        allInDom.forEach(el => {
            if(!presentIds.has(el.id)) el.remove();
        });
        
        if(prefix === 'P') updateHUD();
    }

    // --- COMBATE ---
    function shoot(nx, ny) {
        const now = Date.now();
        const weapon = WEAPONS[myData.weaponIdx];
        if(now - lastShootTime < weapon.s) return;
        
        lastShootTime = now;
        const angle = Math.atan2(ny, nx);
        const bId = "B_" + now + "_" + Math.random().toString().substr(2,3);
        
        const bData = {
            id: bId, x: myData.x, y: myData.y,
            vx: Math.cos(angle) * 18, vy: Math.sin(angle) * 18,
            dist: 0, maxDist: 700
        };
        
        bullets.push(bData);
        
        const el = document.createElement('div');
        el.id = bId;
        el.className = 'bullet';
        el.innerText = '•';
        el.style.color = '#fff';
        gameWorld.appendChild(el);
    }

    function processBullets() {
        for(let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.dist += 18;

            const el = document.getElementById(b.id);
            if(el) el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;

            // Colisão com Zumbis (Client-side prediction)
            let hit = false;
            Object.keys(zombies).forEach(zId => {
                if(hit) return;
                const z = zombies[zId];
                if(Math.abs(b.x - z.x) < 25 && Math.abs(b.y - z.y) < 25) {
                    hitZombie(zId);
                    hit = true;
                }
            });

            if(hit || b.dist > b.maxDist) {
                if(el) el.remove();
                bullets.splice(i, 1);
            }
        }
    }

    function hitZombie(zId) {
        // Feedback visual imediato poderia ser adicionado aqui
        const zRef = ref(db, `rooms/${roomID}/zombies/${zId}`);
        get(zRef).then(snap => {
            if(snap.exists()) {
                const z = snap.val();
                z.hp -= WEAPONS[myData.weaponIdx].d;
                if(z.hp <= 0) {
                    remove(zRef);
                    myData.kills++;
                    updateProgress();
                    if(isHost) setTimeout(spawnZombie, 2000);
                } else {
                    update(zRef, { hp: z.hp });
                }
            }
        });
    }

    function updateProgress() {
        const nextLevel = (myData.weaponIdx + 1) * 8;
        const pct = Math.min(100, (myData.kills % 8) / 8 * 100);
        document.getElementById('xp-bar-fill').style.width = pct + "%";
        document.getElementById('kill-display').innerText = `Kills: ${myData.kills}`;
        
        if(myData.kills >= nextLevel && myData.weaponIdx < WEAPONS.length - 1) {
            myData.weaponIdx++;
        }
    }

    function updateHUD() {
        document.getElementById('hp-display').innerText = "❤️".repeat(myData.hp);
        document.getElementById('gun-display').innerText = WEAPONS[myData.weaponIdx].n;
    }

    function checkCollisions() {
        // Dano do Zumbi
        Object.values(zombies).forEach(z => {
            const dx = myData.x - z.x;
            const dy = myData.y - z.y;
            if(dx*dx + dy*dy < 1600) { // 40px dist squared
                // Knockback
                const ang = Math.atan2(dy, dx);
                myData.x += Math.cos(ang) * 40;
                myData.y += Math.sin(ang) * 40;
                myData.hp--;
                if(myData.hp <= 0) {
                    alert("GAME OVER! Kills: " + myData.kills);
                    location.reload();
                }
            }
        });

        // Itens
        Object.keys(items).forEach(iId => {
            const item = items[iId];
            if(Math.abs(myData.x - item.x) < 30 && Math.abs(myData.y - item.y) < 30) {
                if(myData.hp < 5) {
                    myData.hp++;
                    remove(ref(db, `rooms/${roomID}/items/${iId}`));
                }
            }
        });
    }

    // --- IA HOST ---
    function spawnInitialZombies() {
        for(let i=0; i<20; i++) spawnZombie();
    }
    
    function spawnZombie() {
        const zId = "Z_" + Date.now() + Math.random();
        set(ref(db, `rooms/${roomID}/zombies/${zId}`), {
            x: Math.random() * 2800 + 100,
            y: Math.random() * 2800 + 100,
            type: ZOMBIE_TYPES[Math.floor(Math.random() * ZOMBIE_TYPES.length)],
            hp: 5 + (myData.kills / 10)
        });
    }

    function hostLogic() {
        if(Object.keys(players).length === 0) return;
        
        const updates = {};
        Object.keys(zombies).forEach(zId => {
            const z = zombies[zId];
            let closest = null, minDist = 9999;
            
            Object.values(players).forEach(p => {
                const d = Math.hypot(p.x - z.x, p.y - z.y);
                if(d < minDist) { minDist = d; closest = p; }
            });

            if(closest && minDist < 800) {
                const ang = Math.atan2(closest.y - z.y, closest.x - z.x);
                updates[`rooms/${roomID}/zombies/${zId}/x`] = z.x + Math.cos(ang) * 10;
                updates[`rooms/${roomID}/zombies/${zId}/y`] = z.y + Math.sin(ang) * 10;
            }
        });
        
        // Spawn Cura
        if(Math.random() > 0.95) {
             const iId = "I_" + Date.now();
             updates[`rooms/${roomID}/items/${iId}`] = { x: Math.random()*2800, y: Math.random()*2800, type: "💊" };
        }
        
        update(ref(db), updates);
    }

    // --- CONTROLES ---
    function setupJoy(id, stickId, cb) {
        const box = document.getElementById(id);
        const stick = document.getElementById(stickId);
        let active = false;

        const move = (e) => {
            if(!active) return;
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e;
            const rect = box.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            
            let dx = t.clientX - cx;
            let dy = t.clientY - cy;
            const dist = Math.hypot(dx, dy);
            const max = 40;
            
            if(dist > max) {
                const ratio = max/dist;
                dx *= ratio; dy *= ratio;
            }
            
            stick.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
            cb(dx/max, dy/max);
        };

        const end = (e) => {
            active = false;
            stick.style.transform = `translate3d(0,0,0)`;
            cb(0,0);
        };

        box.addEventListener('mousedown', () => active = true);
        box.addEventListener('touchstart', () => active = true);
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    setupJoy('move-joy', 'move-stick', (x,y) => { myData.vx = x; myData.vy = y; });
    setupJoy('shoot-joy', 'shoot-stick', (x,y) => { if(x||y) shoot(x,y); });

    // Chat
    const ci = document.getElementById('chat-input');
    ci.addEventListener('keydown', e => {
        if(e.key === 'Enter' && ci.value) {
            push(ref(db, `rooms/${roomID}/chat`), { sender: myData.nick, msg: ci.value, color: "#fff" });
            ci.value = "";
        }
    });

    function updateChatUI(data) {
        if(!data) return;
        const log = document.getElementById('chat-log');
        log.innerHTML = "";
        Object.values(data).slice(-10).reverse().forEach(m => {
            const d = document.createElement('div');
            d.innerHTML = `<b style="color:${m.color}">${m.sender}:</b> ${m.msg}`;
            log.appendChild(d);
        });
    }

    // Helper Functions
    window.showPrivateMenu = () => { document.getElementById('menu-screen').style.display = 'none'; document.getElementById('private-menu').style.display = 'flex'; };
    window.backToMenu = () => { document.getElementById('private-menu').style.display = 'none'; document.getElementById('menu-screen').style.display = 'flex'; };

</script>
</body>
    </html>
