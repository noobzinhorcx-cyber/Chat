<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMW Online Coop - Admin Emmanuel</title>
    <script src="https://cdn.jsdelivr.net/npm/emulatorjs@latest/dist/emulator.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; display: flex; flex-direction: column; align-items: center; }
        #game-container { width: 100vw; height: 70vh; background: #222; }
        .controls-mobile { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
        .btn { width: 60px; height: 60px; background: #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; user-select: none; }
        .active { background: #ff4444 !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <div id="status">Conectando ao Firebase...</div>

    <div class="controls-mobile">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="up">▲</div>
        <div class="btn" id="right">▶</div>
        <div class="btn" id="y">Y (Correr)</div>
        <div class="btn" id="down">▼</div>
        <div class="btn" id="b">B (Pular)</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // CONFIGURAÇÃO FIREBASE (Emmanuel 2025)
        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy",
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Identificação do Jogador (P1 ou P2)
        const role = prompt("Você é o Player 1 ou 2?") === "1" ? "p1" : "p2";
        const otherPlayer = role === "p1" ? "p2" : "p1";

        // Inicializar Emulador (EmulatorJS)
        const Emu = new EmulatorJS("game", {
            system: "snes",
            rom: "URL_DA_SUA_ROM_AQUI.smw", // Você precisa hospedar a ROM
            onReady: () => { console.log("Emulador Pronto!"); }
        });

        // --- SINCRONIZAÇÃO DE CONTROLES ---
        const controlsRef = ref(db, 'smw_netplay/' + role);
        const otherRef = ref(db, 'smw_netplay/' + otherPlayer);

        function sendInput(button, state) {
            update(controlsRef, { [button]: state });
        }

        // Ler controles do outro jogador e injetar no emulador
        onValue(otherRef, (snap) => {
            const inputs = snap.val();
            if(inputs) {
                // Aqui o emulador "aperta" o botão para o P2
                // Exemplo: Emu.pressButton(otherPlayer, inputs);
            }
        });

        // Eventos de toque para o celular
        const buttons = ['left', 'right', 'up', 'down', 'b', 'y'];
        buttons.forEach(id => {
            const el = document.getElementById(id);
            el.ontouchstart = () => { sendInput(id, true); el.classList.add('active'); };
            el.ontouchend = () => { sendInput(id, false); el.classList.remove('active'); };
        });

    </script>
</body>
</html>
