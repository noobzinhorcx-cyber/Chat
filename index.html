<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casa Multiplayer - Versão Estável</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- TELA DE LOGIN --- */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { display: block; width: 250px; margin: 10px auto; padding: 12px; border-radius: 5px; border: none; outline: none; }
        button { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin: 5px; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-blue { background: #2196F3; color: white; }

        /* --- CHAT ATUALIZADO --- */
        #game-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #chat-container {
            position: absolute; bottom: 20px; left: 20px; width: 350px; height: 220px;
            background: rgba(0, 0, 0, 0.6); border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; pointer-events: auto;
        }
        #messages { flex: 1; overflow-y: auto; color: #fff; font-size: 14px; margin-bottom: 8px; }
        #messages div { margin-bottom: 4px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .chat-input-area { display: flex; gap: 5px; height: 40px; }
        #chatinput { flex: 1; padding: 0 10px; border-radius: 5px; border: none; background: rgba(255,255,255,0.9); color: #000; }
        #btn-send { width: 45px; background: #2196F3; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }

        /* --- JOYSTICK --- */
        #joystick-zone {
            position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            pointer-events: auto;
        }
        #joystick-thumb {
            position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.8);
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        @media (max-width: 600px) { #chat-container { width: 75%; height: 150px; left: 10px; bottom: 10px; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card">
            <h2>🏠 Casa Online</h2>
            <input id="nick" placeholder="Nickname" type="text" maxlength="12">
            <input id="pass" placeholder="Senha" type="password">
            <button class="btn-green" onclick="register()">Registrar</button>
            <button class="btn-blue" onclick="login()">Entrar</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-ui">
        <div id="chat-container">
            <div id="messages"></div>
            <div class="chat-input-area">
                <input id="chatinput" placeholder="Conversar..." autocomplete="off">
                <button id="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
        <div id="joystick-zone">
            <div id="joystick-thumb"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, push, remove, onDisconnect, get, update } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy",
            storageBucket: "chatrucoy.appspot.com",
            messagingSenderId: "817576008362",
            appId: "1:817576008362:web:278e7f989b244add384ed3",
            measurementId: "G-C4C057R7WL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let player = { x: 500, y: 500, nick: '', tag: '[PLAYER]', color: '#2196F3', isAdmin: false, lastSent: 0 };
        let otherPlayers = {};
        const houseSize = 2000;
        let camera = { x: 0, y: 0 };
        const speed = 6;
        let joystick = { active: false, dx: 0, dy: 0 };

        const walls = [
            { x: 0, y: 0, w: houseSize, h: 20 }, { x: 0, y: houseSize-20, w: houseSize, h: 20 },
            { x: 0, y: 0, w: 20, h: houseSize }, { x: houseSize-20, y: 0, w: 20, h: houseSize },
            { x: 990, y: 20, w: 20, h: 800 }, { x: 990, y: 1180, w: 20, h: 820 },
            { x: 20, y: 990, w: 800, h: 20 }, { x: 1180, y: 990, w: 820, h: 20 }
        ];

        // --- FUNÇÕES DE CONTA ---
        window.register = async () => {
            const nick = document.getElementById('nick').value.trim().replace(/[.#$/[\]]/g, "");
            const pass = document.getElementById('pass').value.trim();
            if (!nick || !pass) return alert("Preencha tudo!");
            const snap = await get(ref(db, 'users/' + nick));
            if (snap.exists()) return alert("Nick em uso!");
            await set(ref(db, 'users/' + nick), { pass, tag: '[MEMBER]', color: '#'+Math.floor(Math.random()*16777215).toString(16) });
            alert("Sucesso! Pode logar.");
        };

        window.login = async () => {
            const nick = document.getElementById('nick').value.trim().replace(/[.#$/[\]]/g, "");
            const pass = document.getElementById('pass').value.trim();
            const snap = await get(ref(db, 'users/' + nick));
            if (!snap.exists() || snap.val().pass !== pass) return alert("Dados incorretos!");
            
            player.nick = nick;
            player.tag = snap.val().tag;
            player.color = snap.val().color;
            player.isAdmin = (nick === 'ADM');

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            startEngine();
        };

        // --- CHAT LÓGICA ---
        window.sendMessage = () => {
            const input = document.getElementById('chatinput');
            const text = input.value.trim();
            if (!text) return;
            
            push(ref(db, 'chat'), {
                nick: player.nick,
                tag: player.tag,
                color: player.color,
                text: text
            });
            input.value = '';
        };

        function startEngine() {
            onValue(ref(db, 'online'), (snap) => {
                otherPlayers = snap.val() || {};
                delete otherPlayers[player.nick];
            });

            onValue(ref(db, 'chat'), (snap) => {
                const msgsDiv = document.getElementById('messages');
                msgsDiv.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.values(data).slice(-15).forEach(m => {
                        const div = document.createElement('div');
                        div.innerHTML = `<small style="color:${m.color}">${m.tag}</small> <b>${m.nick}:</b> ${m.text}`;
                        msgsDiv.appendChild(div);
                    });
                    msgsDiv.scrollTop = msgsDiv.scrollHeight;
                }
            });

            document.getElementById('chatinput').addEventListener('keydown', (e) => {
                if(e.key === 'Enter') window.sendMessage();
            });

            onDisconnect(ref(db, 'online/' + player.nick)).remove();
            setupJoystick();
            requestAnimationFrame(gameLoop);
        }

        // --- SISTEMA DE MOVIMENTO E RENDER ---
        function checkCollision(nx, ny) {
            for (let w of walls) {
                if (nx + 15 > w.x && nx - 15 < w.x + w.w && ny + 15 > w.y && ny - 15 < w.y + w.h) return true;
            }
            return false;
        }

        function gameLoop() {
            if (joystick.active) {
                let nx = player.x + joystick.dx * speed;
                let ny = player.y + joystick.dy * speed;
                if (!checkCollision(nx, player.y)) player.x = nx;
                if (!checkCollision(player.x, ny)) player.y = ny;
                
                const now = Date.now();
                if (now - player.lastSent > 50) {
                    update(ref(db, 'online/' + player.nick), { x: player.x, y: player.y, color: player.color, tag: player.tag });
                    player.lastSent = now;
                }
            }

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Chão e Paredes
            ctx.fillStyle = '#ddd'; ctx.fillRect(0,0,houseSize,houseSize);
            ctx.fillStyle = '#5d4037';
            walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

            // Desenhar Jogadores
            const drawP = (p, name, isMe) => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                ctx.fillText(name, p.x, p.y - 25);
            };

            Object.keys(otherPlayers).forEach(id => drawP(otherPlayers[id], id, false));
            drawP(player, player.nick, true);

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const thumb = document.getElementById('joystick-thumb');
            const handle = (e) => {
                const t = e.touches[0];
                const rect = zone.getBoundingClientRect();
                const center = { x: rect.left + 50, y: rect.top + 50 };
                let dx = t.clientX - center.x;
                let dy = t.clientY - center.y;
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                const angle = Math.atan2(dy, dx);
                joystick.dx = (Math.cos(angle) * dist) / 50;
                joystick.dy = (Math.sin(angle) * dist) / 50;
                thumb.style.left = `calc(50% + ${Math.cos(angle)*dist}px)`;
                thumb.style.top = `calc(50% + ${Math.sin(angle)*dist}px)`;
            };
            zone.addEventListener('touchstart', (e) => { joystick.active = true; handle(e); });
            zone.addEventListener('touchmove', handle);
            zone.addEventListener('touchend', () => { 
                joystick.active = false; 
                thumb.style.left = '50%'; thumb.style.top = '50%';
            });
        }
    </script>
</body>
</html>
