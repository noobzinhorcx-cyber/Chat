<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Multiplayer Vercel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #status-board { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; text-align: center; text-shadow: 0 0 5px #000; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #action-btn { position: absolute; bottom: 80px; right: 60px; width: 80px; height: 80px; background: rgba(0, 255, 100, 0.6); border: 2px solid #00ff66; border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 14px; user-select: none; box-shadow: 0 0 15px #00ff66; }
        #action-btn:active { transform: scale(0.9); background: rgba(0, 255, 100, 0.9); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; z-index: 20; }
    </style>
</head>
<body>

    <div id="loading">Conectando ao Servidor...</div>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div id="status-board">Jogadores Online: <span id="player-count">0</span><br><small>Seu ID: <span id="my-id">...</span></small></div>
        <div id="joystick-zone"></div>
        <div id="action-btn">PULAR</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script type="module">
        // --- 1. CONFIGURAÇÃO FIREBASE (A sua config) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect } 
        from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy",
            storageBucket: "chatrucoy.firebasestorage.app",
            messagingSenderId: "817576008362",
            appId: "1:817576008362:web:278e7f989b244add384ed3",
            measurementId: "G-C4C057R7WL"
        };

        // Inicializa Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Gera ID aleatório para o jogador atual
        const myPlayerId = 'player_' + Math.random().toString(36).substr(2, 9);
        document.getElementById('my-id').innerText = myPlayerId;
        const playerRef = ref(db, 'players/' + myPlayerId);

        // --- 2. ENGINE 3D (THREE.JS) ---
        let scene, camera, renderer;
        let myMesh;
        let otherPlayers = {}; // Guarda os meshes dos outros jogadores
        
        // Controles
        let moveForward = 0, moveSide = 0;
        let verticalVelocity = 0, canJump = true;
        const gravity = 0.02;

        function initGame() {
            document.getElementById('loading').style.display = 'none';

            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);
            scene.fog = new THREE.Fog(0x202020, 10, 60);

            // Câmera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 12);
            camera.lookAt(0, 0, 0);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Chão (Grid)
            const gridHelper = new THREE.GridHelper(200, 100, 0x00ff00, 0x444444);
            scene.add(gridHelper);
            const planeGeo = new THREE.PlaneGeometry(200, 200);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // CRIAR O JOGADOR LOCAL (CUBO CIANO)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ffff }); // Ciano = Eu
            myMesh = new THREE.Mesh(geometry, material);
            myMesh.position.y = 0.5;
            myMesh.castShadow = true;
            scene.add(myMesh);

            // Configurar Joystick e Botões
            setupControls();

            // Iniciar Loop
            animate();

            // --- 3. REDE (MULTIPLAYER) ---
            initNetwork();
        }

        // --- SISTEMA DE REDE ---
        function initNetwork() {
            // 1. Quando eu sair, me remove do banco de dados automaticamente
            onDisconnect(playerRef).remove();

            // 2. Cria minha posição inicial no banco
            set(playerRef, {
                x: 0,
                y: 0.5,
                z: 0,
                color: 0x00ffff
            });

            // 3. Escutar jogadores que ENTRAM
            const allPlayersRef = ref(db, 'players');
            onChildAdded(allPlayersRef, (snapshot) => {
                const addedPlayer = snapshot.val();
                const addedPlayerId = snapshot.key;

                // Se não sou eu, cria o boneco do inimigo
                if (addedPlayerId !== myPlayerId) {
                    createOtherPlayer(addedPlayerId, addedPlayer);
                }
                updatePlayerCount();
            });

            // 4. Escutar jogadores que se MOVEM
            onChildChanged(allPlayersRef, (snapshot) => {
                const data = snapshot.val();
                const id = snapshot.key;

                if (id !== myPlayerId && otherPlayers[id]) {
                    // Atualiza a posição do outro jogador suavemente seria ideal, mas aqui vai direto
                    otherPlayers[id].position.set(data.x, data.y, data.z);
                }
            });

            // 5. Escutar jogadores que SAEM
            onChildRemoved(allPlayersRef, (snapshot) => {
                const id = snapshot.key;
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                    updatePlayerCount();
                }
            });
        }

        function createOtherPlayer(id, data) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            // Outros jogadores são Vermelhos
            const mat = new THREE.MeshPhongMaterial({ color: 0xff0055 }); 
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x, data.y, data.z);
            mesh.castShadow = true;
            
            scene.add(mesh);
            otherPlayers[id] = mesh;
        }

        function updatePlayerCount() {
            // +1 porque conta eu mesmo
            const count = Object.keys(otherPlayers).length + 1;
            document.getElementById('player-count').innerText = count;
        }

        // --- CONTROLES ---
        function setupControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const manager = nipplejs.create({ zone: joystickZone, mode: 'static', position: { left: '50%', top: '50%' }, color: 'white' });

            manager.on('move', (evt, data) => {
                if (data.vector) {
                    moveForward = -data.vector.y;
                    moveSide = data.vector.x;
                }
            });
            manager.on('end', () => { moveForward = 0; moveSide = 0; });

            const jumpBtn = document.getElementById('action-btn');
            const jumpAction = (e) => {
                e.preventDefault();
                if (myMesh.position.y <= 0.6) {
                    verticalVelocity = 0.4;
                    canJump = false;
                }
            };
            jumpBtn.addEventListener('touchstart', jumpAction);
            jumpBtn.addEventListener('mousedown', jumpAction);
        }

        // --- LOOP PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            // Movimento Local
            const speed = 0.3;
            myMesh.position.x += moveSide * speed;
            myMesh.position.z += moveForward * speed;

            // Pulo
            myMesh.position.y += verticalVelocity;
            verticalVelocity -= gravity;
            if (myMesh.position.y < 0.5) {
                myMesh.position.y = 0.5;
                verticalVelocity = 0;
            }

            // Enviar minha nova posição para o Firebase
            // (Otimização: só enviar se moveu significativamente para economizar dados)
            if (moveSide !== 0 || moveForward !== 0 || myMesh.position.y > 0.5) {
                set(playerRef, {
                    x: myMesh.position.x,
                    y: myMesh.position.y,
                    z: myMesh.position.z
                });
            }

            // Câmera segue o jogador
            camera.position.x += (myMesh.position.x - camera.position.x) * 0.1;
            camera.position.z += (myMesh.position.z + 10 - camera.position.z) * 0.1;
            camera.lookAt(myMesh.position);

            renderer.render(scene, camera);
        }

        // Ajuste de tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        initGame();
    </script>
</body>
</html>
