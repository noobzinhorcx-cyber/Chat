<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo Multiplayer Mobile - Casa com Quartos</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #f0f0f0; }
        #canvas { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #login { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        #login input { margin: 10px; padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 5px; }
        #login button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #login button:hover { background: #45a049; }
        #chat { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: rgba(255,255,255,0.8); color: black; display: none; border-top: 1px solid #ccc; }
        #messages { height: 150px; overflow-y: auto; padding: 10px; }
        #chatinput { width: 80%; padding: 10px; border: none; background: #f0f0f0; }
        #chatbutton { width: 18%; padding: 10px; background: #2196F3; color: white; border: none; }
        #joystick { position: absolute; bottom: 50px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0,0,0,0.2); display: none; }
        #joystick-thumb { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.3); transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="login">
        <input id="nick" placeholder="Nickname" type="text"><br>
        <input id="pass" placeholder="Senha" type="password"><br>
        <button onclick="register()">Registrar</button>
        <button onclick="login()">Entrar</button>
    </div>
    <canvas id="canvas"></canvas>
    <div id="chat">
        <div id="messages"></div>
        <input id="chatinput" placeholder="Digite uma mensagem...">
        <button id="chatbutton" onclick="sendMessage()">Enviar</button>
    </div>
    <div id="joystick">
        <div id="joystick-thumb"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, push, remove, onDisconnect, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy",
            storageBucket: "chatrucoy.appspot.com",
            messagingSenderId: "817576008362",
            appId: "1:817576008362:web:278e7f989b244add384ed3",
            measurementId: "G-C4C057R7WL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let player = { x: 500, y: 500, nick: '', tag: '[PLAYER]', color: '#2196F3', isAdmin: false };
        let players = {};
        let tags = { '[PLAYER]': { color: '#2196F3' } };
        let houseSize = 2000;
        let camera = { x: 0, y: 0 };
        let speed = 5;
        let direction = { x: 0, y: 0 };
        let touchStart = { x: 0, y: 0 };
        let joystickActive = false;

        // Definição simples da casa com quartos
        const walls = [
            // Paredes externas
            { x: 0, y: 0, width: houseSize, height: 10 }, // Topo
            { x: 0, y: houseSize - 10, width: houseSize, height: 10 }, // Fundo
            { x: 0, y: 0, width: 10, height: houseSize }, // Esquerda
            { x: houseSize - 10, y: 0, width: 10, height: houseSize }, // Direita
            // Divisões de quartos (4 quartos simples)
            { x: 1000, y: 0, width: 10, height: houseSize }, // Vertical centro
            { x: 0, y: 1000, width: houseSize, height: 10 }, // Horizontal centro
            // Portas (aberturas nas paredes)
            // Porta vertical: remova parte da parede vertical em y=500-600
            // Porta horizontal: remova parte em x=500-600
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loginDiv = document.getElementById('login');
        const chatDiv = document.getElementById('chat');
        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatinput');
        const joystickDiv = document.getElementById('joystick');
        const joystickThumb = document.getElementById('joystick-thumb');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function register() {
            const nick = document.getElementById('nick').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if (!nick || !pass) return alert('Digite nickname e senha');

            const userRef = ref(db, 'users/' + nick);
            const snapshot = await get(userRef);
            if (snapshot.exists()) return alert('Nickname já existe');

            set(userRef, { pass: pass, tag: '[PLAYER]', color: '#2196F3' });
            alert('Registrado com sucesso! Agora faça login.');
        }

        async function login() {
            const nick = document.getElementById('nick').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if (!nick || !pass) return alert('Digite nickname e senha');

            const bannedRef = ref(db, 'banned/' + nick);
            const bannedSnapshot = await get(bannedRef);
            if (bannedSnapshot.exists()) return alert('Você está banido');

            const userRef = ref(db, 'users/' + nick);
            const snapshot = await get(userRef);
            if (!snapshot.exists()) return alert('Usuário não existe');

            const userData = snapshot.val();
            if (userData.pass !== pass) return alert('Senha incorreta');

            player.nick = nick;
            player.tag = userData.tag;
            player.color = userData.color;
            player.isAdmin = (nick === 'ADM' && pass === '123');

            const positionRef = ref(db, 'positions/' + nick);
            const posSnapshot = await get(positionRef);
            if (posSnapshot.exists()) {
                const pos = posSnapshot.val();
                player.x = pos.x;
                player.y = pos.y;
            }

            const playerRef = ref(db, 'online/' + nick);
            set(playerRef, { x: player.x, y: player.y, tag: player.tag, color: player.color });
            onDisconnect(playerRef).remove();

            const disconnectPosRef = onDisconnect(ref(db, 'positions/' + nick));
            disconnectPosRef.set({ x: player.x, y: player.y });

            loginDiv.style.display = 'none';
            canvas.style.display = 'block';
            chatDiv.style.display = 'block';
            joystickDiv.style.display = 'block';

            initListeners();
        }

        function initListeners() {
            onValue(ref(db, 'online'), (snapshot) => {
                players = snapshot.val() || {};
            });

            onValue(ref(db, 'chat'), (snapshot) => {
                messagesDiv.innerHTML = '';
                snapshot.forEach((child) => {
                    const msg = child.val();
                    messagesDiv.innerHTML += `<div><span style="color:${msg.color}; font-weight: bold;">${msg.tag}</span> <b>${msg.nick}:</b> ${msg.text}</div>`;
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            onValue(ref(db, 'tags'), (snapshot) => {
                tags = snapshot.val() || { '[PLAYER]': { color: '#2196F3' } };
            });

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';

            if (text.startsWith('/') && player.isAdmin) {
                handleCommand(text);
                return;
            }

            const chatRef = ref(db, 'chat');
            push(chatRef, { nick: player.nick, tag: player.tag, color: player.color, text });
        }

        function handleCommand(cmd) {
            const parts = cmd.split(' ');
            const command = parts[0];

            if (command === '/limpar') {
                remove(ref(db, 'chat'));
            } else if (command === '/tp') {
                if (parts.length === 3) {
                    player.x = parseInt(parts[1]) || player.x;
                    player.y = parseInt(parts[2]) || player.y;
                    updatePosition();
                }
            } else if (command === '/ban') {
                const name = parts[1];
                if (name) set(ref(db, 'banned/' + name), true);
            } else if (command === '/createtag') {
                const tagName = parts[1];
                const color = parts[2] || '#000000';
                if (tagName) {
                    set(ref(db, 'tags/' + tagName), { color });
                    push(ref(db, 'chat'), { nick: 'Sistema', tag: '', color: '#888', text: `Tag ${tagName} criada com cor ${color}.` });
                }
            } else if (command === '/givetag') {
                const name = parts[1];
                const tagName = parts[2];
                if (name && tagName && tags[tagName]) {
                    set(ref(db, 'users/' + name + '/tag'), tagName);
                    set(ref(db, 'users/' + name + '/color'), tags[tagName].color);
                    push(ref(db, 'chat'), { nick: 'Sistema', tag: '', color: '#888', text: `Tag ${tagName} dada para ${name}.` });
                }
            } else if (command === '/listtags') {
                let tagList = Object.keys(tags).join(', ');
                push(ref(db, 'chat'), { nick: 'Sistema', tag: '', color: '#888', text: `Tags disponíveis: ${tagList}` });
            }
        }

        function updatePosition() {
            const playerRef = ref(db, 'online/' + player.nick);
            set(playerRef, { x: player.x, y: player.y, tag: player.tag, color: player.color });

            const posRef = ref(db, 'positions/' + player.nick);
            onDisconnect(posRef).set({ x: player.x, y: player.y });
        }

        function checkCollision(newX, newY) {
            const playerSize = 20;
            for (let wall of walls) {
                if (newX + playerSize > wall.x && newX < wall.x + wall.width &&
                    newY + playerSize > wall.y && newY < wall.y + wall.height) {
                    return true;
                }
            }
            return false;
        }

        function handleTouchStart(e) {
            if (e.touches.length === 0) return;
            const touch = e.touches[0];
            if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2) {
                joystickActive = true;
                touchStart.x = touch.clientX;
                touchStart.y = touch.clientY;
                joystickDiv.style.left = `${touchStart.x}px`;
                joystickDiv.style.top = `${touchStart.y}px`;
                joystickDiv.style.display = 'block';
                joystickThumb.style.left = '50%';
                joystickThumb.style.top = '50%';
            }
        }

        function handleTouchMove(e) {
            if (!joystickActive || e.touches.length === 0) return;
            const touch = e.touches[0];
            let dx = touch.clientX - touchStart.x;
            let dy = touch.clientY - touchStart.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 60) {
                dx = (dx / dist) * 60;
                dy = (dy / dist) * 60;
            }
            joystickThumb.style.left = `${50 + (dx / 1.2)}%`;
            joystickThumb.style.top = `${50 + (dy / 1.2)}%`;
            direction.x = dx / 60;
            direction.y = dy / 60;
        }

        function handleTouchEnd() {
            joystickActive = false;
            direction = { x: 0, y: 0 };
            joystickDiv.style.display = 'none';
        }

        function gameLoop() {
            let newX = player.x + direction.x * speed;
            let newY = player.y + direction.y * speed;

            if (!checkCollision(newX, player.y)) player.x = newX;
            if (!checkCollision(player.x, newY)) player.y = newY;

            player.x = Math.max(0, Math.min(houseSize, player.x));
            player.y = Math.max(0, Math.min(houseSize, player.y));

            if (Math.abs(direction.x) > 0 || Math.abs(direction.y) > 0) updatePosition();

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            camera.x = Math.max(0, Math.min(houseSize - canvas.width, camera.x));
            camera.y = Math.max(0, Math.min(houseSize - canvas.height, camera.y));

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fundo da casa (piso simples)
            ctx.fillStyle = '#E0CDA9'; // Cor de piso de madeira
            ctx.fillRect(-camera.x, -camera.y, houseSize, houseSize);

            // Desenhar paredes
            ctx.fillStyle = '#A0522D'; // Cor de parede marrom
            for (let wall of walls) {
                ctx.fillRect(wall.x - camera.x, wall.y - camera.y, wall.width, wall.height);
            }

            // Desenhar portas (apenas visual, sem colisão extra)
            ctx.fillStyle = '#8B4513'; // Cor de porta
            // Porta na parede vertical
            ctx.fillRect(1000 - camera.x, 450 - camera.y, 10, 100);
            // Porta na parede horizontal
            ctx.fillRect(450 - camera.x, 1000 - camera.y, 100, 10);

            // Desenhar jogadores
            for (let nick in players) {
                const p = players[nick];
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(p.x - camera.x, p.y - camera.y, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = p.color;
                ctx.font = 'bold 14px Arial';
                ctx.fillText(p.tag, p.x - camera.x - 30, p.y - camera.y - 25);
                ctx.fillStyle = '#fff';
                ctx.fillText(nick, p.x - camera.x - 30, p.y - camera.y - 10);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
