<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 2.0</title>
    <style>
        :root { --blue: #0095f6; --bg: #fafafa; --border: #dbdbdb; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-top: 60px; }
        
        /* Login Overlay */
        #login-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { border: 1px solid var(--border); padding: 40px; display: flex; flex-direction: column; gap: 10px; width: 300px; }
        
        /* Nav */
        nav { background: white; border-bottom: 1px solid var(--border); position: fixed; top: 0; width: 100%; height: 60px; display: flex; justify-content: center; z-index: 1000; }
        .nav-c { width: 100%; max-width: 935px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }

        .main-grid { max-width: 935px; margin: 20px auto; display: grid; grid-template-columns: 1fr 300px; gap: 28px; }
        
        /* Stories */
        .stories { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; gap: 15px; overflow-x: auto; }
        .story { text-align: center; font-size: 12px; width: 66px; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #e1306c; padding: 2px; }

        /* Posts */
        .post { background: white; border: 1px solid var(--border); border-radius: 8px; margin-top: 20px; }
        .post-header { padding: 14px; font-weight: 600; display: flex; align-items: center; }
        .post-img { width: 100%; display: block; }
        .post-content { padding: 14px; }

        /* Sidebar Sugestões */
        .sidebar { position: sticky; top: 80px; }
        .sug-box { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 15px; }

        input[type="file"] { display: none; }
        .btn { background: var(--blue); color: white; border: none; border-radius: 4px; padding: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="text-align: center;">Instagram 2</h1>
            <input type="text" id="reg-user" placeholder="Nome de usuário">
            <input type="password" id="reg-pass" placeholder="Senha">
            <button class="btn" onclick="registrarUsuario()">Entrar e Salvar IP</button>
        </div>
    </div>

    <nav>
        <div class="nav-c">
            <div style="font-weight: bold; font-size: 20px;">Instagram 2.0</div>
            <div>
                <label class="btn" style="background:#efefef; color:black;"> ➕ Foto
                    <input type="file" id="file-input" accept="image/*" onchange="subirFoto(this)">
                </label>
            </div>
        </div>
    </nav>

    <div class="main-grid">
        <section>
            <div class="stories" id="st-list"></div>
            <div id="feed"></div>
        </section>
        
        <aside class="sidebar">
            <div class="sug-box">
                <p style="color: #8e8e8e; font-weight: 600;">Sugestões (Pessoas Reais)</p>
                <div id="user-list"></div>
            </div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, push, onValue, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';
        // Importe o Storage para as fotos funcionarem
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy",
            storageBucket: "chatrucoy.appspot.com" // Verifique se é este no seu console
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        let meuIp, meuUser;

        // --- LOGIN POR IP ---
        async function checarAcesso() {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            meuIp = data.ip.replace(/\./g, '_');

            const snap = await get(ref(db, `ips/${meuIp}`));
            if (snap.exists()) {
                meuUser = snap.val().username;
                iniciarApp();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        }

        window.registrarUsuario = async () => {
            const user = document.getElementById('reg-user').value;
            if(!user) return alert("Digite um nome");
            
            await set(ref(db, `ips/${meuIp}`), { username: user });
            await set(ref(db, `users/${user}`), { username: user, ip: meuIp });
            location.reload();
        }

        function iniciarApp() {
            document.getElementById('login-screen').style.display = 'none';
            carregarFeed();
            carregarSugestoes();
        }

        // --- POSTAR FOTO REAL ---
        window.subirFoto = async (input) => {
            const file = input.files[0];
            if(!file) return;

            const fileRef = sRef(storage, `posts/${Date.now()}_${file.name}`);
            alert("Subindo foto... aguarde");
            
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);

            const newPost = push(ref(db, 'posts'));
            set(newPost, {
                user: meuUser,
                url: url,
                date: Date.now()
            });
        };

        function carregarFeed() {
            onValue(ref(db, 'posts'), (snap) => {
                const feed = document.getElementById('feed');
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML = `
                    <div class="post">
                        <div class="post-header">${post.user}</div>
                        <img src="${post.url}" class="post-img">
                        <div class="post-content"><b>${post.user}</b> Foto real enviada agora!</div>
                    </div>` + feed.innerHTML;
                });
            });
        }

        function carregarSugestoes() {
            onValue(ref(db, 'users'), (snap) => {
                const list = document.getElementById('user-list');
                list.innerHTML = '';
                snap.forEach(u => {
                    if(u.key !== meuUser) {
                        list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-top:10px;">
                            <span>${u.key}</span>
                            <button class="btn" style="padding:4px 8px; font-size:11px;">Seguir</button>
                        </div>`;
                    }
                });
            });
        }

        checarAcesso();
    </script>
</body>
                </html>
