<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penguin Chef - Multiplayer</title>
    <style>
        :root { --main-red: #ff4757; --main-blue: #2f3542; --gold: #f1c40f; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Arial', sans-serif; touch-action: none; user-select: none; }
        
        /* Menu */
        #menu { position: absolute; inset: 0; background: linear-gradient(45deg, #2f3542, #57606f); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; margin: 5px; width: 200px; text-align: center; }
        button { padding: 12px 25px; font-size: 18px; border-radius: 8px; border: none; background: var(--main-red); color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        
        /* Game UI */
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; color: white; text-shadow: 2px 2px black; font-size: 20px; font-weight: bold; }
        
        /* CONTROLES FIXED (Joystick corrigido) */
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        #joystick-zone { 
            width: 120px; height: 120px; background: rgba(255,255,255,0.1); 
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; 
            position: relative; pointer-events: auto; touch-action: none;
        }
        #joystick-nub { 
            width: 50px; height: 50px; background: white; border-radius: 50%; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        #action-btn { 
            width: 90px; height: 90px; background: var(--main-red); color: white; 
            border-radius: 50%; pointer-events: auto; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; text-align: center; font-weight: bold;
            box-shadow: 0 6px #b33939; border: 2px solid rgba(255,255,255,0.2);
        }
        #action-btn:active { transform: translateY(4px); box-shadow: 0 2px #b33939; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>🐧 PENGUIN KITCHEN</h1>
        <input type="text" id="username" placeholder="Seu Nome" maxlength="8">
        <input type="text" id="room-input" placeholder="Código da Sala" maxlength="5">
        <div style="display: flex;">
            <button id="create-btn">CRIAR</button>
            <button id="join-btn">ENTRAR</button>
        </div>
        <p id="status-msg"></p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div>SCORE: <span id="score">0</span></div>
            <div id="room-display">SALA: ---</div>
        </div>
        <div id="controls">
            <div id="joystick-zone"><div id="joystick-nub"></div></div>
            <div id="action-btn">SEGURE<br>COZINHAR</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, push, remove, onDisconnect, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const DISHES = [
            { id: 1, icon: "🍔", time: 2000, color: "#e67e22" }, { id: 2, icon: "🍕", time: 2500, color: "#e74c3c" },
            { id: 3, icon: "🍣", time: 1500, color: "#ecf0f1" }, { id: 4, icon: "🥗", time: 1000, color: "#2ecc71" },
            { id: 5, icon: "🍜", time: 3000, color: "#f1c40f" }, { id: 6, icon: "🌮", time: 1800, color: "#d35400" },
            { id: 7, icon: "🥩", time: 3500, color: "#c0392b" }, { id: 8, icon: "🥤", time: 500, color: "#3498db" },
            { id: 9, icon: "🍰", time: 2200, color: "#fd79a8" }, { id: 10, icon: "☕", time: 800, color: "#5d4037" }
        ];

        let myId = 'p' + Math.floor(Math.random()*9999);
        let roomId = null;
        let players = {}, customers = {}, score = 0;
        let joystick = { active: false, dx: 0, dy: 0 };
        let actionHeld = false, cookTimer = 0, currentStation = null;
        let layout = { stations: [], tables: [] };

        // --- MENU LOGIC ---
        document.getElementById('create-btn').onclick = () => start(true);
        document.getElementById('join-btn').onclick = () => start(false);

        async function start(isHost) {
            const name = document.getElementById('username').value || "Chef";
            const inputRoom = document.getElementById('room-input').value.toUpperCase();
            roomId = isHost ? Math.random().toString(36).substr(2, 5).toUpperCase() : inputRoom;

            if(!isHost) {
                const snap = await get(ref(db, `rooms/${roomId}`));
                if(!snap.exists()) return alert("Sala não existe!");
            } else {
                await set(ref(db, `rooms/${roomId}`), { score: 0, host: myId });
            }

            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('room-display').innerText = "SALA: " + roomId;
            
            initGame(name);
        }

        function initGame(name) {
            resize();
            const myRef = ref(db, `rooms/${roomId}/players/${myId}`);
            set(myRef, { name, x: canvas.width/2, y: canvas.height/2, color: `hsl(${Math.random()*360}, 70%, 60%)`, holding: null });
            onDisconnect(myRef).remove();

            onValue(ref(db, `rooms/${roomId}`), (snap) => {
                const data = snap.val();
                if(!data) return;
                players = data.players || {};
                customers = data.customers || {};
                score = data.score || 0;
                document.getElementById('score').innerText = score;
            });

            // Host gerencia os clientes
            get(ref(db, `rooms/${roomId}/host`)).then(snap => {
                if(snap.val() === myId) setInterval(updateCustomers, 2000);
            });

            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const size = Math.min(canvas.width, canvas.height) * 0.12;
            
            // Layout: 10 Estações no topo (Cozinha)
            layout.stations = [];
            for(let i=0; i<10; i++) {
                layout.stations.push({
                    x: (canvas.width/11) * (i+1),
                    y: 60, dish: DISHES[i], size: size * 0.8
                });
            }
            // Layout: 4 Mesas no salão
            layout.tables = [];
            for(let i=0; i<4; i++) {
                layout.tables.push({
                    id: i, x: (canvas.width/5) * (i+1), y: canvas.height * 0.6, size: size
                });
            }
        }

        // --- JOYSTICK LOGIC (O FIX) ---
        const joyZone = document.getElementById('joystick-zone');
        const joyNub = document.getElementById('joystick-nub');

        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystick.active = true;
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if(!joystick.active) return;
            const touch = e.touches[0];
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.hypot(dx, dy);
            const max = rect.width / 2;

            if(distance > max) {
                dx *= max / distance;
                dy *= max / distance;
            }

            joystick.dx = dx / max;
            joystick.dy = dy / max;
            joyNub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            joystick.active = false;
            joystick.dx = 0; joystick.dy = 0;
            joyNub.style.transform = `translate(-50%, -50%)`;
        });

        // --- BOTÃO DE AÇÃO ---
        const actBtn = document.getElementById('action-btn');
        actBtn.addEventListener('touchstart', (e) => { e.preventDefault(); actionHeld = true; });
        actBtn.addEventListener('touchend', () => { actionHeld = false; cookTimer = 0; currentStation = null; });

        // --- LÓGICA DE JOGO ---
        function updateCustomers() {
            const current = Object.keys(customers).length;
            if(current < 3 && Math.random() > 0.5) {
                const table = layout.tables[Math.floor(Math.random()*layout.tables.length)];
                if(!Object.values(customers).some(c => c.tableId === table.id)) {
                    const newRef = push(ref(db, `rooms/${roomId}/customers`));
                    set(newRef, { tableId: table.id, wanted: Math.floor(Math.random()*10)+1, patience: 100 });
                }
            }
            // Reduzir paciência
            Object.keys(customers).forEach(key => {
                const p = customers[key].patience - 2;
                if(p <= 0) remove(ref(db, `rooms/${roomId}/customers/${key}`));
                else update(ref(db, `rooms/${roomId}/customers/${key}`), { patience: p });
            });
        }

        function loop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Desenhar Chão
            ctx.fillStyle = "#3d3d3d"; // Cozinha
            ctx.fillRect(0,0, canvas.width, canvas.height * 0.3);
            ctx.fillStyle = "#5d4037"; // Salão
            ctx.fillRect(0, canvas.height * 0.3, canvas.width, canvas.height * 0.7);

            // Estações
            layout.stations.forEach(s => {
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(s.x - s.size/2, s.y - s.size/2, s.size, s.size);
                ctx.font = `${s.size*0.5}px Arial`;
                ctx.textAlign = "center";
                ctx.fillText(s.dish.icon, s.x, s.y + 10);
            });

            // Mesas
            layout.tables.forEach(t => {
                ctx.fillStyle = "#ecf0f1";
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.size/2, 0, Math.PI*2);
                ctx.fill();
                
                const cust = Object.values(customers).find(c => c.tableId === t.id);
                if(cust) {
                    const dish = DISHES.find(d => d.id === cust.wanted);
                    ctx.fillStyle = "#2f3542";
                    ctx.beginPath(); ctx.arc(t.x, t.y - 20, 15, 0, Math.PI*2); ctx.fill();
                    // Barra Paciência
                    ctx.fillStyle = "red"; ctx.fillRect(t.x-20, t.y-50, 40, 5);
                    ctx.fillStyle = "#2ecc71"; ctx.fillRect(t.x-20, t.y-50, 40 * (cust.patience/100), 5);
                    ctx.fillText(dish.icon, t.x + 25, t.y - 40);
                }
            });

            // Players
            const me = players[myId];
            if(me) {
                if(joystick.active) {
                    me.x += joystick.dx * 5; me.y += joystick.dy * 5;
                    update(ref(db, `rooms/${roomId}/players/${myId}`), { x: me.x, y: me.y });
                }

                // Lógica de Cozinhar / Entregar
                if(actionHeld) {
                    const station = layout.stations.find(s => Math.hypot(me.x-s.x, me.y-s.y) < 50);
                    if(station && !me.holding) {
                        currentStation = station;
                        cookTimer += 16.6;
                        if(cookTimer >= station.dish.time) {
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: station.dish.id });
                            actionHeld = false;
                        }
                    }
                    
                    const table = layout.tables.find(t => Math.hypot(me.x-t.x, me.y-t.y) < 60);
                    if(table && me.holding) {
                        const cKey = Object.keys(customers).find(k => customers[k].tableId === table.id);
                        if(cKey && customers[cKey].wanted === me.holding) {
                            update(ref(db, `rooms/${roomId}`), { score: score + 100 });
                            remove(ref(db, `rooms/${roomId}/customers/${cKey}`));
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: null });
                            actionHeld = false;
                        }
                    }
                }
            }

            Object.values(players).forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(p.x, p.y+5, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "bold 12px Arial"; ctx.fillText(p.name, p.x, p.y - 25);
                if(p.holding) ctx.fillText(DISHES.find(d => d.id === p.holding).icon, p.x, p.y - 40);
                
                if(p === me && actionHeld && currentStation) {
                    ctx.fillStyle = "white"; ctx.fillRect(p.x-20, p.y-60, 40, 5);
                    ctx.fillStyle = "#f1c40f"; ctx.fillRect(p.x-20, p.y-60, 40 * (cookTimer/currentStation.dish.time), 5);
                }
            });

            requestAnimationFrame(loop);
        }
        window.onresize = resize;
    </script>
</body>
</html>
