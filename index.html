<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penguin Chef - Som & NPCs</title>
    <style>
        :root { --main-red: #ff4757; --main-blue: #2e86de; --gold: #f1c40f; }
        body { margin: 0; overflow: hidden; background: #2f3542; font-family: sans-serif; touch-action: none; user-select: none; }
        
        /* MENU */
        #menu { position: absolute; inset: 0; background: linear-gradient(135deg, #1e272e, #485460); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        h1 { font-size: 2.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin: 0 0 20px 0; }
        input { padding: 15px; font-size: 18px; border-radius: 12px; border: none; margin: 8px; width: 220px; text-align: center; text-transform: uppercase; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: white; margin: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        button:active { transform: translateY(4px); box-shadow: none; }
        #create-btn { background: var(--main-blue); }
        #join-btn { background: var(--main-red); }

        /* JOGO */
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
        canvas { display: block; }
        
        #hud { position: absolute; top: 0; width: 100%; pointer-events: none; padding: 10px; box-sizing: border-box; display: flex; justify-content: space-between; font-weight: bold; color: white; text-shadow: 2px 2px 0 #000; font-size: 20px; }
        #room-code { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px; font-size: 16px; }

        /* CONTROLES */
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        #joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; }
        #joystick-nub { width: 50px; height: 50px; background: white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        .action-group { display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: flex-end; }
        .btn { width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 3px solid rgba(255,255,255,0.3); text-shadow: 1px 1px 2px black; user-select: none; }
        #action-btn { background: #ff4757; box-shadow: 0 6px #b33939; }
        #boost-btn { width: 70px; height: 70px; background: #2e86de; box-shadow: 0 6px #1d5ca3; font-size: 12px; }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>🐧 PENGUIN CHEF</h1>
        <input type="text" id="username" placeholder="Seu Nome" maxlength="8">
        <input type="text" id="room-input" placeholder="CÓD SALA (Ex: ABCD)" maxlength="5">
        <div>
            <button id="create-btn">CRIAR SALA</button>
            <button id="join-btn">ENTRAR</button>
        </div>
    </div>

    <div id="game-over">
        <h1>💀 FIM DE JOGO</h1>
        <p>Clientes perdidos: 5/5</p>
        <button onclick="location.reload()" style="background: white; color: black;">REINICIAR</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div>💰 <span id="score">0</span></div>
            <div>😡 <span id="lost-count">0</span>/5</div>
        </div>
        <div id="room-code">SALA: ----</div>
        <div id="controls">
            <div id="joystick-zone"><div id="joystick-nub"></div></div>
            <div class="action-group">
                <div id="boost-btn" class="btn">NITRO</div>
                <div id="action-btn" class="btn">COZINHAR</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, push, remove, onDisconnect, get, runTransaction } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SISTEMA DE SONS (CORRIGIDO) ---
        const sfx = {
            bgm: new Audio('https://actions.google.com/sounds/v1/science_fiction/glitchy_digital_opening.ogg'),
            cook: new Audio('https://actions.google.com/sounds/v1/water/liquid_simmering_loop.ogg'),
            success: new Audio('https://actions.google.com/sounds/v1/cartoon/clime_bing_bing.ogg'),
            fail: new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg'),
            nitro: new Audio('https://actions.google.com/sounds/v1/transportation/car_passing_by.ogg')
        };
        sfx.bgm.loop = true; sfx.bgm.volume = 0.4;
        sfx.cook.loop = true; 

        // Função para ativar som no clique do usuário (browser policy)
        function initAudio() {
            sfx.bgm.play().catch(() => console.log("Erro BGM"));
            // Toca e pausa rapidinho os outros para "aquecer" o áudio
            sfx.success.volume = 0; sfx.success.play().then(() => { sfx.success.pause(); sfx.success.volume = 0.5; });
        }

        const DISHES = [
            { id: 1, icon: "🍔", time: 2000 }, { id: 2, icon: "🍕", time: 2500 },
            { id: 3, icon: "🍣", time: 1500 }, { id: 4, icon: "🥗", time: 1000 },
            { id: 5, icon: "🍜", time: 3000 }, { id: 6, icon: "🍦", time: 500 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let myId = 'p' + Math.floor(Math.random()*9999);
        let roomId = null, isHost = false;
        let players = {}, customers = {}, score = 0, lostCount = 0;
        let joystick = { active: false, dx: 0, dy: 0 };
        let actionHeld = false, cookTimer = 0, currentStation = null;
        let layout = { stations: [], tables: [] };
        let isBoosting = false;

        // --- INICIAR JOGO ---
        document.getElementById('create-btn').onclick = () => { initAudio(); start(true); };
        document.getElementById('join-btn').onclick = () => { initAudio(); start(false); };

        async function start(host) {
            const name = document.getElementById('username').value || "Chef";
            const codeInput = document.getElementById('room-input').value.toUpperCase();
            
            if(host) {
                // Gerar código de 4 letras
                roomId = "";
                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
                for(let i=0; i<4; i++) roomId += chars.charAt(Math.floor(Math.random()*chars.length));
                await set(ref(db, `rooms/${roomId}`), { score: 0, lostCount: 0, hostId: myId, startTime: Date.now() });
            } else {
                if(codeInput.length < 4) return alert("Código inválido!");
                roomId = codeInput;
                const check = await get(ref(db, `rooms/${roomId}`));
                if(!check.exists()) return alert("Sala não encontrada!");
            }

            isHost = host;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('room-code').innerText = "SALA: " + roomId;

            setupPlayer(name);
            gameLoop();
        }

        function setupPlayer(name) {
            resize();
            const playerRef = ref(db, `rooms/${roomId}/players/${myId}`);
            set(playerRef, { 
                name, x: canvas.width/2, y: canvas.height/2, 
                color: `hsl(${Math.random()*360}, 70%, 50%)`, holding: null 
            });
            onDisconnect(playerRef).remove();

            // Listener principal
            onValue(ref(db, `rooms/${roomId}`), (snap) => {
                const data = snap.val();
                if(!data) return;
                players = data.players || {};
                customers = data.customers || {};
                score = data.score || 0;
                
                if(data.lostCount > lostCount) sfx.fail.play();
                lostCount = data.lostCount || 0;
                
                document.getElementById('score').innerText = score;
                document.getElementById('lost-count').innerText = lostCount;
                if(lostCount >= 5) {
                    document.getElementById('game-over').style.display = 'flex';
                    sfx.bgm.pause();
                }
            });

            if(isHost) setInterval(hostLogic, 2000); // Lógica do Host
        }

        function hostLogic() {
            // Gerar Clientes
            if(Object.keys(customers).length < 3 && Math.random() > 0.4) {
                const table = layout.tables[Math.floor(Math.random()*layout.tables.length)];
                // Verifica se mesa está vazia
                const occupied = Object.values(customers).some(c => c.tableId === table.id);
                if(!occupied) {
                    push(ref(db, `rooms/${roomId}/customers`), { 
                        tableId: table.id, 
                        wanted: DISHES[Math.floor(Math.random()*DISHES.length)].id, 
                        patience: 100 
                    });
                }
            }
            // Reduzir Paciência
            Object.keys(customers).forEach(k => {
                const p = customers[k].patience - 5;
                if(p <= 0) {
                    remove(ref(db, `rooms/${roomId}/customers/${k}`));
                    runTransaction(ref(db, `rooms/${roomId}/lostCount`), (c) => (c||0) + 1);
                } else {
                    update(ref(db, `rooms/${roomId}/customers/${k}`), { patience: p });
                }
            });
        }

        // --- CONTROLES ---
        const joyZone = document.getElementById('joystick-zone');
        joyZone.ontouchstart = (e) => { e.preventDefault(); joystick.active = true; };
        window.ontouchmove = (e) => {
            if(!joystick.active) return;
            const t = e.touches[0];
            const rect = joyZone.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.hypot(dx, dy), max = rect.width/2;
            if(dist > max) { dx *= max/dist; dy *= max/dist; }
            joystick.dx = dx/max; joystick.dy = dy/max;
            document.getElementById('joystick-nub').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        };
        window.ontouchend = () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; document.getElementById('joystick-nub').style.transform = `translate(-50%, -50%)`; };

        document.getElementById('action-btn').ontouchstart = (e) => { e.preventDefault(); actionHeld = true; };
        document.getElementById('action-btn').ontouchend = () => { actionHeld = false; cookTimer = 0; sfx.cook.pause(); };
        
        document.getElementById('boost-btn').onclick = (e) => {
            if(isBoosting) return;
            isBoosting = true; sfx.nitro.play();
            e.target.classList.add('disabled');
            setTimeout(() => { isBoosting = false; setTimeout(() => e.target.classList.remove('disabled'), 5000); }, 3000);
        };

        // --- RENDERIZAR ---
        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            // Recalcular posições
            const pad = canvas.width / (DISHES.length+1);
            layout.stations = DISHES.map((d, i) => ({ x: pad*(i+1), y: 80, dish: d, size: 50 }));
            layout.tables = [0,1,2,3].map(i => ({ id: i, x: (i%2==0 ? canvas.width*0.25 : canvas.width*0.75), y: 300 + Math.floor(i/2)*150, size: 60 }));
        }
        window.onresize = resize;

        function gameLoop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Fundo
            ctx.fillStyle = "#3d3d3d"; ctx.fillRect(0,0, canvas.width, 150); // Cozinha
            ctx.fillStyle = "#7f8c8d"; ctx.fillRect(0, 150, canvas.width, canvas.height); // Salão

            // 1. Estações
            layout.stations.forEach(s => {
                ctx.fillStyle = "#bdc3c7"; ctx.fillRect(s.x-25, s.y-25, 50, 50);
                ctx.font = "30px Arial"; ctx.textAlign="center"; ctx.fillText(s.dish.icon, s.x, s.y+10);
            });

            // 2. Mesas e Clientes (NPCs)
            layout.tables.forEach(t => {
                // Mesa
                ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(t.x, t.y, t.size/2, 0, Math.PI*2); ctx.fill();
                
                // Verificar cliente
                const cust = Object.values(customers).find(c => c.tableId === t.id);
                if(cust) {
                    // DESENHAR O PINGUIM NPC
                    ctx.font = "40px Arial"; ctx.textAlign="center";
                    ctx.fillText("🐧", t.x, t.y - 10); // NPC sentado
                    
                    // Balão de pedido
                    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(t.x+30, t.y-30, 20, 0, Math.PI*2); ctx.fill();
                    ctx.font = "20px Arial";
                    const dish = DISHES.find(d => d.id === cust.wanted);
                    if(dish) ctx.fillText(dish.icon, t.x+30, t.y-25);

                    // Barra de vida
                    ctx.fillStyle = "red"; ctx.fillRect(t.x-25, t.y+35, 50, 5);
                    ctx.fillStyle = "#2ecc71"; ctx.fillRect(t.x-25, t.y+35, 50 * (cust.patience/100), 5);
                }
            });

            // 3. Jogadores (Eu e Outros)
            const me = players[myId];
            if(me && lostCount < 5) {
                // Movimento
                if(joystick.active) {
                    const spd = isBoosting ? 10 : 5;
                    me.x += joystick.dx * spd; me.y += joystick.dy * spd;
                    update(ref(db, `rooms/${roomId}/players/${myId}`), { x: me.x, y: me.y });
                }

                // Ação
                if(actionHeld) {
                    // Cozinhar
                    const station = layout.stations.find(s => Math.hypot(me.x-s.x, me.y-s.y) < 50);
                    if(station && !me.holding) {
                        if(sfx.cook.paused) sfx.cook.play();
                        currentStation = station;
                        cookTimer += (isBoosting? 35 : 17);
                        if(cookTimer >= station.dish.time) {
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: station.dish.id });
                            actionHeld = false; sfx.cook.pause(); sfx.success.play();
                        }
                    }
                    // Entregar
                    const table = layout.tables.find(t => Math.hypot(me.x-t.x, me.y-t.y) < 60);
                    if(table && me.holding) {
                        const cKey = Object.keys(customers).find(k => customers[k].tableId === table.id);
                        if(cKey && customers[cKey].wanted === me.holding) {
                            remove(ref(db, `rooms/${roomId}/customers/${cKey}`));
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: null });
                            runTransaction(ref(db, `rooms/${roomId}/score`), s => (s||0)+100);
                            sfx.success.play(); actionHeld = false;
                        }
                    }
                }
            }

            // Desenhar Jogadores
            Object.values(players).forEach(p => {
                // Sombra
                ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(p.x, p.y+15, 15, 8, 0, 0, Math.PI*2); ctx.fill();
                // Pinguim
                ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText("🐧", p.x, p.y);
                // Nome e Prato
                ctx.fillStyle = "white"; ctx.font = "12px Arial"; ctx.fillText(p.name, p.x, p.y-35);
                if(p.holding) {
                    const d = DISHES.find(x => x.id === p.holding);
                    if(d) ctx.fillText(d.icon, p.x, p.y-50);
                }
                // Barra de Progresso
                if(p.name === me?.name && actionHeld && currentStation) {
                    ctx.fillStyle = "gold"; ctx.fillRect(p.x-20, p.y-20, 40 * (cookTimer/currentStation.dish.time), 5);
                }
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
    </html>
