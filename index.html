<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-EMOJI FIXED</title>
    <style>
        :root { --p-color: #00ff00; }
        body { 
            margin: 0; 
            background: #111; 
            color: #eee; 
            font-family: monospace; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none; 
        }

        /* O MUNDO DO JOGO */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-world {
            position: absolute;
            width: 3000px;
            height: 3000px;
            /* Grid para referência visual */
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 50px 50px;
            background-color: #0a0a0a;
            transform-origin: 0 0;
            /* Otimização de GPU SOMENTE no container principal */
            will-change: transform;
            z-index: 1;
        }

        /* ENTIDADES (Inimigos, Players) */
        .entity {
            position: absolute;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 30px;
            /* Centralizar o ponto de ancoragem */
            margin-left: -20px;
            margin-top: -20px;
            z-index: 10;
            /* Transição suave de movimento */
            transition: left 0.1s linear, top 0.1s linear; 
        }

        .player-name {
            position: absolute;
            top: -20px;
            left: -50%;
            width: 200%;
            font-size: 10px;
            color: #0f0;
            text-shadow: 1px 1px #000;
        }

        .me .player-name { color: #ff0; font-weight: bold; }
        .me { z-index: 20; filter: drop-shadow(0 0 5px yellow); }

        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 8px; border-left: 3px solid var(--p-color); margin-bottom: 5px; color: #fff; font-weight: bold; }

        /* MENUS */
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 2000;
        }
        input, button { padding: 12px; margin: 8px; border-radius: 5px; width: 250px; font-size: 16px; }
        button { background: var(--p-color); border: none; font-weight: bold; cursor: pointer; }
        input { background: #333; border: 1px solid #555; color: white; text-align: center; }

        /* CONTROLES */
        .joy-area {
            position: fixed; bottom: 40px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 1000;
        }
        #stick-left, #stick-right {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none;
        }
        #joy-left { left: 30px; }
        #joy-right { right: 30px; border-color: rgba(255,50,50,0.3); }

        .bullet {
            position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%;
            z-index: 5; pointer-events: none; margin-left: -5px; margin-top: -5px;
        }
        
        #debug-info { position: fixed; top: 0; right: 0; color: lime; font-size: 10px; z-index: 3000; background: black; padding: 2px; }
    </style>
</head>
<body>

<div id="debug-info">FPS: 60</div>

<div id="game-container">
    <div id="game-world">
        </div>
</div>

<div id="hud">
    <div class="stat-box" id="hud-weapon">👊 Soco</div>
    <div class="stat-box" id="hud-hp">❤️❤️❤️❤️❤️</div>
    <div class="stat-box" id="hud-kills">Kills: 0</div>
</div>

<div id="joy-left" class="joy-area"><div id="stick-left"></div></div>
<div id="joy-right" class="joy-area"><div id="stick-right"></div></div>

<div id="menu-screen" class="overlay">
    <h1 style="color:var(--p-color); font-size: 3em;">Z-EMOJI</h1>
    <input type="text" id="nickname" placeholder="Seu Nome" maxlength="10">
    <button onclick="startGameSetup('public')">JOGAR AGORA</button>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update, remove, onDisconnect, push, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    // 1. CONFIGURAÇÃO (Substitua se necessário, mas essa é pública de teste)
    const firebaseConfig = {
        apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
        authDomain: "chatrucoy.firebaseapp.com",
        databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
        projectId: "chatrucoy"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 2. VARIÁVEIS GLOBAIS
    const myId = "P_" + Math.random().toString(36).substr(2, 6);
    let roomID = "GLOBAL_ROOM_V3"; // Sala única para testar rápido
    let isHost = false;
    let isPlaying = false;
    
    // Estado Local
    let player = {
        x: 1500, y: 1500,
        vx: 0, vy: 0,
        hp: 5, kills: 0,
        weapon: 0,
        nick: "Player"
    };

    // Cache de Dados
    let otherPlayers = {};
    let zombies = {};
    let bullets = [];
    
    // Configurações de Jogo
    const WEAPONS = [
        {name: "👊 Soco", dmg: 1, delay: 300},
        {name: "🔫 Glock", dmg: 2, delay: 500},
        {name: "🔫 Uzi", dmg: 1, delay: 100},
        {name: "💣 Bazuca", dmg: 10, delay: 1000}
    ];
    let lastShoot = 0;
    let lastSync = 0;

    // Referências DOM
    const worldEl = document.getElementById('game-world');
    const debugEl = document.getElementById('debug-info');

    // 3. INICIALIZAÇÃO
    window.startGameSetup = (mode) => {
        const name = document.getElementById('nickname').value || "Survivor";
        player.nick = name;
        
        document.getElementById('menu-screen').style.display = 'none';
        isPlaying = true;
        
        // Conectar Firebase
        connectToRoom();
        
        // Iniciar Loop
        requestAnimationFrame(gameLoop);
    };

    function connectToRoom() {
        const pRef = ref(db, `rooms/${roomID}/players/${myId}`);
        set(pRef, { x: player.x, y: player.y, nick: player.nick, hp: player.hp });
        onDisconnect(pRef).remove();

        // Verificar Host
        get(ref(db, `rooms/${roomID}/host`)).then(snap => {
            if (!snap.exists()) {
                set(ref(db, `rooms/${roomID}/host`), myId);
                isHost = true;
                setInterval(hostLoop, 1000); // Lógica de IA do Host
                spawnZombies(10);
            }
        });

        // Listeners
        onValue(ref(db, `rooms/${roomID}/players`), snap => {
            const data = snap.val() || {};
            delete data[myId]; // Remover eu mesmo da lista de "outros"
            otherPlayers = data;
        });

        onValue(ref(db, `rooms/${roomID}/zombies`), snap => {
            zombies = snap.val() || {};
        });
    }

    // 4. LOOP PRINCIPAL (CORE)
    function gameLoop() {
        if (!isPlaying) return;

        try {
            // A. Movimento Local
            player.x += player.vx * 5;
            player.y += player.vy * 5;
            
            // Limites do Mapa
            player.x = Math.max(20, Math.min(2980, player.x));
            player.y = Math.max(20, Math.min(2980, player.y));

            // B. Câmera (Centraliza o Mundo)
            const cx = window.innerWidth / 2 - player.x;
            const cy = window.innerHeight / 2 - player.y;
            worldEl.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;

            // C. Sincronização (Reduzir uso de dados)
            const now = Date.now();
            if (now - lastSync > 100) { // 10 FPS de upload
                update(ref(db, `rooms/${roomID}/players/${myId}`), {
                    x: Math.round(player.x),
                    y: Math.round(player.y)
                });
                lastSync = now;
            }

            // D. Balas
            updateBullets();

            // E. Renderização
            renderAll();
            
            // F. Debug
            debugEl.innerText = `X: ${Math.round(player.x)} Y: ${Math.round(player.y)} | ENT: ${Object.keys(zombies).length + Object.keys(otherPlayers).length}`;

        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    // 5. RENDERIZAÇÃO (Bulletproof)
    function renderAll() {
        // Renderizar EU
        renderEntity(myId, player, 'P', true);

        // Renderizar OUTROS
        Object.keys(otherPlayers).forEach(id => {
            renderEntity(id, otherPlayers[id], 'P', false);
        });

        // Renderizar ZUMBIS
        Object.keys(zombies).forEach(id => {
            renderEntity(id, zombies[id], 'Z', false);
        });

        // Limpeza (Garbage Collection visual)
        // Remove elementos que não estão mais nos dados
        const allDom = document.querySelectorAll('.entity');
        allDom.forEach(el => {
            if (el.id !== myId && !otherPlayers[el.id] && !zombies[el.id]) {
                el.remove();
            }
        });
    }

    function renderEntity(id, data, type, isMe) {
        let el = document.getElementById(id);
        
        // Criar se não existe
        if (!el) {
            el = document.createElement('div');
            el.id = id;
            el.className = 'entity';
            if (isMe) el.classList.add('me');
            
            if (type === 'P') {
                el.innerHTML = `<div class="player-name">${data.nick}</div>👤`;
            } else {
                el.innerText = data.type || '🧟';
            }
            worldEl.appendChild(el);
        }

        // Posicionar (Usando Top/Left para garantir visibilidade)
        el.style.left = data.x + 'px';
        el.style.top = data.y + 'px';
    }

    // 6. COMBATE E FÍSICA
    function shoot(dx, dy) {
        const now = Date.now();
        const w = WEAPONS[player.weapon];
        if (now - lastShoot < w.delay) return;
        lastShoot = now;

        const angle = Math.atan2(dy, dx);
        const b = {
            id: 'B_' + Math.random(),
            x: player.x, y: player.y,
            vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
            life: 60
        };
        bullets.push(b);

        // Elemento visual da bala
        const el = document.createElement('div');
        el.id = b.id;
        el.className = 'bullet';
        worldEl.appendChild(el);
    }

    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            const el = document.getElementById(b.id);
            if (el) {
                el.style.left = b.x + 'px';
                el.style.top = b.y + 'px';
            }

            // Colisão Zumbi (Básico)
            if (b.life <= 0) {
                if (el) el.remove();
                bullets.splice(i, 1);
                continue;
            }

            // Checar colisão
            Object.keys(zombies).forEach(zid => {
                const z = zombies[zid];
                const dist = Math.hypot(b.x - z.x, b.y - z.y);
                if (dist < 30) {
                    // Hit!
                    if (el) el.remove();
                    bullets.splice(i, 1); // Remove bala
                    
                    // Efeito visual ou lógica de dano aqui
                    // Como cliente, apenas removemos a bala visualmente.
                    // O Dano real idealmente seria enviado ao servidor, mas aqui fazemos direto:
                    const zRef = ref(db, `rooms/${roomID}/zombies/${zid}`);
                    get(zRef).then(s => {
                         if(s.exists()) {
                             const nhp = s.val().hp - WEAPONS[player.weapon].dmg;
                             if(nhp <= 0) {
                                 remove(zRef);
                                 player.kills++;
                                 document.getElementById('hud-kills').innerText = "Kills: " + player.kills;
                                 checkLevelUp();
                             } else {
                                 update(zRef, {hp: nhp});
                             }
                         }
                    });
                    return; // Sai do loop de zumbis
                }
            });
        }
    }

    function checkLevelUp() {
        if(player.kills > (player.weapon+1)*5 && player.weapon < WEAPONS.length-1) {
            player.weapon++;
            document.getElementById('hud-weapon').innerText = WEAPONS[player.weapon].name;
        }
    }

    // 7. LÓGICA DO HOST (IA SIMPLES)
    function hostLoop() {
        // Mover Zumbis
        const updates = {};
        let needsUpdate = false;
        
        Object.keys(zombies).forEach(zid => {
            const z = zombies[zid];
            // Perseguir player mais proximo
            // (Simplificado: persegue o host pra economizar cálculo no exemplo)
            const dx = player.x - z.x;
            const dy = player.y - z.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist < 800 && dist > 10) {
                const angle = Math.atan2(dy, dx);
                z.x += Math.cos(angle) * 3;
                z.y += Math.sin(angle) * 3;
                updates[`rooms/${roomID}/zombies/${zid}`] = z;
                needsUpdate = true;
            }
        });
        
        if(needsUpdate) update(ref(db), updates);

        // Repor Zumbis
        if (Object.keys(zombies).length < 5) spawnZombies(1);
    }

    function spawnZombies(qtd) {
        for(let i=0; i<qtd; i++) {
            const zid = "Z_" + Date.now() + i;
            set(ref(db, `rooms/${roomID}/zombies/${zid}`), {
                x: Math.random() * 2800 + 100,
                y: Math.random() * 2800 + 100,
                hp: 5,
                type: "🧟"
            });
        }
    }

    // 8. CONTROLES (JOYSTICK)
    function setupJoystick(areaId, stickId, callback) {
        const area = document.getElementById(areaId);
        const stick = document.getElementById(stickId);
        let dragging = false;

        function handleMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const rect = area.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;

            if (dist > maxDist) {
                const ratio = maxDist / dist;
                dx *= ratio;
                dy *= ratio;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            callback(dx / maxDist, dy / maxDist);
        }

        function endDrag() {
            dragging = false;
            stick.style.transform = `translate(0px, 0px)`;
            callback(0, 0);
        }

        area.addEventListener('mousedown', () => dragging = true);
        area.addEventListener('touchstart', () => dragging = true);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
    }

    setupJoystick('joy-left', 'stick-left', (x, y) => {
        player.vx = x;
        player.vy = y;
    });

    setupJoystick('joy-right', 'stick-right', (x, y) => {
        if (Math.abs(x) > 0.1 || Math.abs(y) > 0.1) shoot(x, y);
    });

</script>
</body>
    </html>
