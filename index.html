<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Parkour Online</title>
    <style>
        :root { --p-blue: #3498db; --p-red: #e74c3c; --bg: #111; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: sans-serif; color: white; touch-action: none; }
        canvas { display: block; }

        /* LOGIN */
        #login-screen {
            position: absolute; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .card { background: #222; padding: 30px; border-radius: 15px; text-align: center; border: 2px solid #333; }
        input { padding: 12px; border-radius: 8px; border: none; width: 200px; margin-bottom: 10px; }
        button { padding: 12px 20px; background: var(--p-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* UI DO JOGO */
        #game-ui { display: none; position: absolute; inset: 0; pointer-events: none; }
        #chat-area {
            position: absolute; bottom: 20px; left: 20px; width: 280px;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; pointer-events: auto;
        }
        #messages { height: 100px; overflow-y: auto; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        #chat-input { background: transparent; border: 1px solid #444; color: white; width: 100%; padding: 5px; box-sizing: border-box; }

        /* CONTROLES MOBILE */
        .controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; pointer-events: auto; }
        .btn-joy { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; user-select: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card">
            <h2>SUPER PARKOUR</h2>
            <input id="nick" placeholder="Seu Nickname" maxlength="10">
            <button onclick="game.login()">START GAME</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-ui">
        <div id="chat-area">
            <div id="messages"></div>
            <input id="chat-input" placeholder="Pressione Enter...">
        </div>
        <div class="controls">
            <div class="btn-joy" onmousedown="game.keys.a=true" onmouseup="game.keys.a=false" ontouchstart="game.keys.a=true" ontouchend="game.keys.a=false">◀</div>
            <div class="btn-joy" onmousedown="game.keys.d=true" onmouseup="game.keys.d=false" ontouchstart="game.keys.d=true" ontouchend="game.keys.d=false">▶</div>
            <div class="btn-joy" onmousedown="game.keys.w=true" onmouseup="game.keys.w=false" ontouchstart="game.keys.w=true" ontouchend="game.keys.w=false">▲</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, push, onDisconnect, update } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        // Configuração mantida conforme seu banco de dados
        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const game = {
            canvas: document.getElementById('canvas'),
            ctx: null,
            player: { nick: '', x: 100, y: 100, vx: 0, vy: 0, ground: false, color: '#3498db' },
            others: {},
            keys: { a: false, d: false, w: false },
            world: {
                gravity: 0.8,
                friction: 0.8,
                platforms: [
                    {x: 0, y: 500, w: 2000, h: 50},   // Chão
                    {x: 300, y: 400, w: 150, h: 20},  // Plataformas estilo Mario
                    {x: 600, y: 320, w: 150, h: 20},
                    {x: 900, y: 240, w: 200, h: 20},
                    {x: 1200, y: 350, w: 150, h: 20},
                    {x: 1500, y: 250, w: 100, h: 20}
                ]
            },
            camera: 0,

            async login() {
                const n = document.getElementById('nick').value.trim();
                if(!n) return;
                this.player.nick = n;
                this.player.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                this.init();
            },

            init() {
                this.ctx = this.canvas.getContext('2d');
                window.onresize = () => { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; };
                window.onresize();

                // Entrada do Teclado
                window.onkeydown = (e) => this.handleKey(e.key, true);
                window.onkeyup = (e) => this.handleKey(e.key, false);

                // Firebase Sync
                onValue(ref(db, 'parkour/players'), s => this.others = s.val() || {});
                onValue(ref(db, 'parkour/chat'), s => this.updateChat(s.val()));
                onDisconnect(ref(db, 'parkour/players/' + this.player.nick)).remove();

                // Chat Enter
                document.getElementById('chat-input').onkeydown = (e) => {
                    if(e.key === 'Enter') this.sendChat();
                };

                this.loop();
            },

            handleKey(key, state) {
                if(key === 'ArrowLeft' || key === 'a') this.keys.a = state;
                if(key === 'ArrowRight' || key === 'd') this.keys.d = state;
                if(key === 'ArrowUp' || key === 'w' || key === ' ') this.keys.w = state;
            },

            sendChat() {
                const el = document.getElementById('chat-input');
                if(!el.value) return;
                push(ref(db, 'parkour/chat'), { n: this.player.nick, t: el.value });
                el.value = '';
            },

            updateChat(data) {
                const box = document.getElementById('messages');
                box.innerHTML = '';
                if(!data) return;
                Object.values(data).slice(-5).forEach(m => {
                    box.innerHTML += `<div><b>${m.n}:</b> ${m.t}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            },

            update() {
                const p = this.player;

                // Movimento Horizontal
                if (this.keys.a) p.vx -= 1.5;
                if (this.keys.d) p.vx += 1.5;
                p.vx *= this.world.friction;

                // Gravidade e Pulo
                p.vy += this.world.gravity;
                if (this.keys.w && p.ground) {
                    p.vy = -16;
                    p.ground = false;
                }

                p.x += p.vx;
                p.y += p.vy;
                p.ground = false;

                // Colisão Simples com Plataformas
                this.world.platforms.forEach(plat => {
                    if (p.x + 20 > plat.x && p.x - 20 < plat.x + plat.w &&
                        p.y + 20 > plat.y && p.y - 20 < plat.y + plat.h) {
                        if (p.vy > 0 && p.y < plat.y) { // Caindo em cima
                            p.y = plat.y - 20;
                            p.vy = 0;
                            p.ground = true;
                        }
                    }
                });

                // Limites do Mundo
                if (p.y > 1000) { p.x = 100; p.y = 100; p.vx = 0; p.vy = 0; }

                // Sync com Firebase (Apenas se houver movimento relevante para economizar dados)
                const now = Date.now();
                if(!this.lastSync || now - this.lastSync > 30) {
                    update(ref(db, 'parkour/players/' + p.nick), {
                        x: Math.round(p.x), y: Math.round(p.y), c: p.color
                    });
                    this.lastSync = now;
                }

                // Câmera segue o player
                this.camera += (p.x - this.canvas.width/2 - this.camera) * 0.1;
            },

            draw() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.save();
                ctx.translate(-this.camera, 0);

                // Desenha Plataformas
                ctx.fillStyle = '#444';
                this.world.platforms.forEach(plat => {
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = '#555';
                    ctx.fillRect(plat.x, plat.y, plat.w, 4); // Topo da plataforma
                });

                // Desenha Outros Jogadores
                for(let id in this.others) {
                    if(id === this.player.nick) continue;
                    const o = this.others[id];
                    ctx.fillStyle = o.c;
                    ctx.fillRect(o.x - 15, o.y - 15, 30, 30);
                    ctx.fillStyle = 'white';
                    ctx.font = '10px Arial';
                    ctx.fillText(id, o.x, o.y - 25);
                }

                // Desenha Meu Player
                ctx.fillStyle = this.player.color;
                ctx.fillRect(this.player.x - 15, this.player.y - 15, 30, 30);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.player.x - 15, this.player.y - 15, 30, 30);
                
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText(this.player.nick, this.player.x, this.player.y - 25);

                ctx.restore();
            },

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        window.game = game;
    </script>
</body>
</html>
