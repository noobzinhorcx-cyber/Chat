<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penguin Chef - Hardcore com Som</title>
    <style>
        :root { --main-red: #ff4757; --main-blue: #2e86de; --gold: #f1c40f; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Arial', sans-serif; touch-action: none; user-select: none; }
        #menu { position: absolute; inset: 0; background: linear-gradient(45deg, #2f3542, #57606f); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; margin: 5px; width: 200px; text-align: center; }
        button { padding: 12px 25px; font-size: 18px; border-radius: 8px; border: none; background: var(--main-red); color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; padding: 0 10px; box-sizing: border-box; pointer-events: none; color: white; text-shadow: 2px 2px black; font-size: 18px; font-weight: bold; z-index: 10; }
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        #joystick-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; }
        #joystick-nub { width: 45px; height: 45px; background: white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .action-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .btn { width: 85px; height: 85px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; font-weight: bold; color: white; border: 2px solid rgba(255,255,255,0.2); transition: 0.1s; }
        #action-btn { background: var(--main-red); box-shadow: 0 5px #b33939; }
        #boost-btn { background: var(--main-blue); box-shadow: 0 5px #1d5ca3; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px rgba(0,0,0,0.5); }
        .disabled { background: #555 !important; box-shadow: 0 2px #333 !important; opacity: 0.6; }
        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>👨‍🍳 PENGUIN KITCHEN <br><small>HARDCORE + SOUNDS</small></h1>
        <input type="text" id="username" placeholder="Seu Nome" maxlength="8">
        <input type="text" id="room-input" placeholder="Cód. Sala" maxlength="5">
        <div style="display: flex;">
            <button id="create-btn">CRIAR</button>
            <button id="join-btn">ENTRAR</button>
        </div>
    </div>

    <div id="game-over">
        <h1 style="color: #ff4757; font-size: 40px;">RESTAURANTE FECHADO!</h1>
        <button onclick="location.reload()">TENTAR NOVAMENTE</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div>💰 $<span id="score">0</span></div>
            <div id="lost-hud" style="color: #ff4757;">😠 PERDIDOS: <span id="lost-count">0</span>/5</div>
        </div>
        <div id="controls">
            <div id="joystick-zone"><div id="joystick-nub"></div></div>
            <div class="action-group">
                <div id="boost-btn" class="btn">NITRO</div>
                <div id="action-btn" class="btn">SEGURE<br>COZINHAR</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, push, remove, onDisconnect, get, runTransaction } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        // --- CONFIG FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SISTEMA DE SONS ---
        const sfx = {
            bgm: new Audio('https://actions.google.com/sounds/v1/science_fiction/glitchy_digital_opening.ogg'),
            cook: new Audio('https://actions.google.com/sounds/v1/water/liquid_simmering_loop.ogg'),
            success: new Audio('https://actions.google.com/sounds/v1/cartoon/clime_bing_bing.ogg'),
            fail: new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock_beeping.ogg'),
            nitro: new Audio('https://actions.google.com/sounds/v1/transportation/car_passing_by.ogg')
        };
        sfx.bgm.loop = true; sfx.bgm.volume = 0.3;
        sfx.cook.loop = true; sfx.cook.volume = 0.5;

        // --- VARIÁVEIS DO JOGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const DISHES = [
            { id: 1, icon: "🍔", time: 2000 }, { id: 2, icon: "🍕", time: 2500 },
            { id: 3, icon: "🍣", time: 1500 }, { id: 4, icon: "🥗", time: 1000 },
            { id: 5, icon: "🍜", time: 3000 }, { id: 6, icon: "🌮", time: 1800 },
            { id: 7, icon: "🥩", time: 3500 }, { id: 8, icon: "🥤", time: 500 },
            { id: 9, icon: "🍰", time: 2200 }, { id: 10, icon: "☕", time: 800 }
        ];

        let myId = 'p' + Math.floor(Math.random()*9999);
        let roomId = null, isHost = false;
        let players = {}, customers = {}, score = 0, lostCount = 0;
        let joystick = { active: false, dx: 0, dy: 0 };
        let actionHeld = false, cookTimer = 0, currentStation = null;
        let layout = { stations: [], tables: [] };
        let isBoosting = false, boostCooldown = false;

        // --- MENU & START ---
        document.getElementById('create-btn').onclick = () => start(true);
        document.getElementById('join-btn').onclick = () => start(false);

        async function start(hostStatus) {
            const name = document.getElementById('username').value || "Chef";
            const inputRoom = document.getElementById('room-input').value.toUpperCase();
            roomId = hostStatus ? Math.random().toString(36).substr(2, 5).toUpperCase() : inputRoom;
            isHost = hostStatus;

            if(!isHost) {
                const snap = await get(ref(db, `rooms/${roomId}`));
                if(!snap.exists()) return alert("Sala não encontrada!");
            } else {
                await set(ref(db, `rooms/${roomId}`), { score: 0, lostCount: 0, difficulty: 1, hostId: myId, startTime: Date.now() });
            }

            // Iniciar Áudio
            sfx.bgm.play().catch(() => console.log("Áudio bloqueado pelo browser"));
            
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-container').style.display = 'block';
            initGame(name);
        }

        function initGame(name) {
            resize();
            const myRef = ref(db, `rooms/${roomId}/players/${myId}`);
            set(myRef, { name, x: canvas.width/2, y: canvas.height/2, color: `hsl(${Math.random()*360}, 70%, 60%)`, holding: null });
            onDisconnect(myRef).remove();

            onValue(ref(db, `rooms/${roomId}`), (snap) => {
                const data = snap.val();
                if(!data) return;
                players = data.players || {};
                customers = data.customers || {};
                score = data.score || 0;
                
                // Se o número de perdidos aumentou, toca som de erro
                if(data.lostCount > lostCount) sfx.fail.play();
                lostCount = data.lostCount || 0;
                
                document.getElementById('score').innerText = score;
                document.getElementById('lost-count').innerText = lostCount;
                if(lostCount >= 5) {
                    document.getElementById('game-over').style.display = 'flex';
                    sfx.bgm.pause();
                }
            });

            if(isHost) setInterval(updateHostLogic, 1000);
            requestAnimationFrame(loop);
        }

        function updateHostLogic() {
            const roomRef = ref(db, `rooms/${roomId}`);
            get(roomRef).then(snap => {
                const data = snap.val();
                const timeElapsed = (Date.now() - data.startTime) / 1000;
                const diff = 1 + Math.floor(timeElapsed / 30) * 0.2;
                update(roomRef, { difficulty: diff });

                if(Object.keys(customers).length < 3 && Math.random() > 0.6) {
                    const table = layout.tables[Math.floor(Math.random()*layout.tables.length)];
                    if(!Object.values(customers).some(c => c.tableId === table.id)) {
                        push(ref(db, `rooms/${roomId}/customers`), { tableId: table.id, wanted: Math.floor(Math.random()*10)+1, patience: 100 });
                    }
                }

                Object.keys(customers).forEach(key => {
                    const p = customers[key].patience - (2 * diff);
                    if(p <= 0) {
                        remove(ref(db, `rooms/${roomId}/customers/${key}`));
                        runTransaction(ref(db, `rooms/${roomId}/lostCount`), (c) => (c || 0) + 1);
                    } else {
                        update(ref(db, `rooms/${roomId}/customers/${key}`), { patience: p });
                    }
                });
            });
        }

        // --- CONTROLES & NITRO ---
        const boostBtn = document.getElementById('boost-btn');
        boostBtn.onclick = () => {
            if(boostCooldown || isBoosting) return;
            isBoosting = true; sfx.nitro.play();
            boostBtn.classList.add('disabled');
            setTimeout(() => { 
                isBoosting = false; boostCooldown = true; 
                setTimeout(() => { boostCooldown = false; boostBtn.classList.remove('disabled'); }, 10000);
            }, 10000);
        };

        const joyZone = document.getElementById('joystick-zone');
        const joyNub = document.getElementById('joystick-nub');
        joyZone.ontouchstart = (e) => { e.preventDefault(); joystick.active = true; };
        window.ontouchmove = (e) => {
            if(!joystick.active) return;
            const t = e.touches[0]; const r = joyZone.getBoundingClientRect();
            const cx = r.left + r.width/2; const cy = r.top + r.height/2;
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.hypot(dx, dy), max = r.width/2;
            if(dist > max) { dx *= max/dist; dy *= max/dist; }
            joystick.dx = dx/max; joystick.dy = dy/max;
            joyNub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        };
        window.ontouchend = () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; joyNub.style.transform = `translate(-50%, -50%)`; };

        const actBtn = document.getElementById('action-btn');
        actBtn.ontouchstart = (e) => { e.preventDefault(); actionHeld = true; };
        actBtn.ontouchend = () => { actionHeld = false; cookTimer = 0; currentStation = null; sfx.cook.pause(); };

        // --- RENDER & LOGIC ---
        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const size = Math.min(canvas.width, canvas.height) * 0.12;
            layout.stations = [];
            for(let i=0; i<10; i++) layout.stations.push({ x: (canvas.width/11) * (i+1), y: 60, dish: DISHES[i], size: size * 0.7 });
            layout.tables = [];
            for(let i=0; i<4; i++) layout.tables.push({ id: i, x: (canvas.width/5) * (i+1), y: canvas.height * 0.6, size: size });
        }

        function loop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "#3d3d3d"; ctx.fillRect(0,0, canvas.width, canvas.height * 0.3);
            ctx.fillStyle = "#5d4037"; ctx.fillRect(0, canvas.height * 0.3, canvas.width, canvas.height * 0.7);

            layout.stations.forEach(s => {
                ctx.fillStyle = "#2c3e50"; ctx.fillRect(s.x - s.size/2, s.y - s.size/2, s.size, s.size);
                ctx.font = `${s.size*0.5}px Arial`; ctx.textAlign = "center"; ctx.fillText(s.dish.icon, s.x, s.y + 10);
            });

            layout.tables.forEach(t => {
                ctx.fillStyle = "#ecf0f1"; ctx.beginPath(); ctx.arc(t.x, t.y, t.size/2, 0, Math.PI*2); ctx.fill();
                const cust = Object.values(customers).find(c => c.tableId === t.id);
                if(cust) {
                    ctx.fillStyle = "red"; ctx.fillRect(t.x-20, t.y-50, 40, 5);
                    ctx.fillStyle = "#2ecc71"; ctx.fillRect(t.x-20, t.y-50, 40 * (cust.patience/100), 5);
                    ctx.fillText(DISHES.find(d => d.id === cust.wanted).icon, t.x + 25, t.y - 40);
                }
            });

            const me = players[myId];
            if(me && lostCount < 5) {
                if(joystick.active) {
                    const spd = isBoosting ? 10 : 5;
                    me.x += joystick.dx * spd; me.y += joystick.dy * spd;
                    update(ref(db, `rooms/${roomId}/players/${myId}`), { x: me.x, y: me.y });
                }

                if(actionHeld) {
                    const station = layout.stations.find(s => Math.hypot(me.x-s.x, me.y-s.y) < 50);
                    if(station && !me.holding) {
                        currentStation = station; cookTimer += (isBoosting ? 34 : 17);
                        if(sfx.cook.paused) sfx.cook.play();
                        if(cookTimer >= station.dish.time) {
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: station.dish.id });
                            actionHeld = false; sfx.cook.pause();
                        }
                    }
                    const table = layout.tables.find(t => Math.hypot(me.x-t.x, me.y-t.y) < 60);
                    if(table && me.holding) {
                        const cKey = Object.keys(customers).find(k => customers[k].tableId === table.id);
                        if(cKey && customers[cKey].wanted === me.holding) {
                            runTransaction(ref(db, `rooms/${roomId}/score`), s => (s || 0) + 100);
                            remove(ref(db, `rooms/${roomId}/customers/${cKey}`));
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: null });
                            actionHeld = false; sfx.success.play();
                        }
                    }
                }
            }

            Object.values(players).forEach(p => {
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(p.x, p.y+5, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "bold 12px Arial"; ctx.fillText(p.name, p.x, p.y - 25);
                if(p.holding) ctx.fillText(DISHES.find(d => d.id === p.holding).icon, p.x, p.y - 40);
                if(p.name === me?.name && actionHeld && currentStation) {
                    ctx.fillStyle = "white"; ctx.fillRect(p.x-20, p.y-60, 40, 5);
                    ctx.fillStyle = "#f1c40f"; ctx.fillRect(p.x-20, p.y-60, 40 * (cookTimer/currentStation.dish.time), 5);
                }
            });

            requestAnimationFrame(loop);
        }
        window.onresize = resize;
    </script>
</body>
    </html>
