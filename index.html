<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penguin Chef - Hardcore Edition</title>
    <style>
        :root { --main-red: #ff4757; --main-blue: #2e86de; --gold: #f1c40f; --dark: #1e272e; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        
        /* MENU */
        #menu { position: absolute; inset: 0; background: linear-gradient(135deg, #1e272e, #485460); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        h1 { margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 2.5rem; }
        h1 small { display: block; font-size: 1rem; color: var(--gold); letter-spacing: 2px; margin-top: 5px; }
        
        input { padding: 15px; font-size: 18px; border-radius: 12px; border: 2px solid #57606f; margin: 8px; width: 220px; text-align: center; background: #2f3542; color: white; outline: none; transition: 0.3s; text-transform: uppercase; }
        input:focus { border-color: var(--gold); transform: scale(1.05); }
        
        .menu-btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; color: white; transition: transform 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        button:active { transform: translateY(4px); box-shadow: none; }
        #create-btn { background: var(--main-blue); }
        #join-btn { background: var(--main-red); }

        /* JOGO */
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; background: #2f3542; }
        canvas { display: block; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .hud-panel { position: absolute; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; color: white; font-weight: bold; border: 2px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
        
        #score-panel { top: 15px; left: 15px; font-size: 20px; color: var(--gold); }
        #lost-panel { top: 15px; right: 15px; font-size: 16px; color: var(--main-red); }
        
        /* CÓDIGO DA SALA (NOVO) */
        #room-display { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            background: rgba(46, 134, 222, 0.9); 
            padding: 10px 25px; border-radius: 10px; 
            font-size: 24px; font-weight: 900; color: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid white;
            text-shadow: 1px 1px 0 #000;
        }

        /* CONTROLES */
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; z-index: 20; }
        #joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; pointer-events: auto; backdrop-filter: blur(2px); }
        #joystick-nub { width: 50px; height: 50px; background: linear-gradient(to bottom, #fff, #bdc3c7); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none; }
        
        .action-group { display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: flex-end; }
        .btn { width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; text-align: center; font-weight: 900; color: white; border: 3px solid rgba(255,255,255,0.3); transition: 0.1s; user-select: none; text-shadow: 1px 1px 2px black; }
        
        #action-btn { background: linear-gradient(to bottom, #ff6b6b, #ee5253); box-shadow: 0 6px #b33939; }
        #action-btn:active { transform: translateY(6px); box-shadow: 0 0 #b33939; }
        
        #boost-btn { width: 70px; height: 70px; font-size: 12px; background: linear-gradient(to bottom, #54a0ff, #2e86de); box-shadow: 0 6px #1d5ca3; }
        #boost-btn:active { transform: translateY(6px); box-shadow: 0 0 #1d5ca3; }
        .disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        /* TELA FINAL */
        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>🐧 PENGUIN CHEF<br><small>HARDCORE KITCHEN</small></h1>
        <input type="text" id="username" placeholder="Seu Apelido" maxlength="8">
        <input type="text" id="room-input" placeholder="Código da Sala" maxlength="5">
        <div class="menu-btn-group">
            <button id="create-btn">CRIAR SALA</button>
            <button id="join-btn">ENTRAR</button>
        </div>
    </div>

    <div id="game-over">
        <div style="font-size: 60px;">💀</div>
        <h1 style="color: #ff4757; margin: 10px;">COZINHA FECHADA</h1>
        <p>Muitos clientes insatisfeitos!</p>
        <button onclick="location.reload()" style="background: white; color: black; margin-top: 20px;">JOGAR DE NOVO</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud">
            <div id="room-display">SALA: ----</div>
            
            <div id="score-panel" class="hud-panel">💰 $<span id="score">0</span></div>
            <div id="lost-panel" class="hud-panel">😡 SAÍRAM: <span id="lost-count">0</span>/5</div>
        </div>

        <div id="controls">
            <div id="joystick-zone"><div id="joystick-nub"></div></div>
            <div class="action-group">
                <div id="boost-btn" class="btn">⚡ NITRO</div>
                <div id="action-btn" class="btn">🍳<br>COZINHAR</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, push, remove, onDisconnect, get, runTransaction } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

        // --- CONFIG FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q",
            authDomain: "chatrucoy.firebaseapp.com",
            databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
            projectId: "chatrucoy"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SISTEMA DE SONS (FIXED) ---
        // Usamos sons curtos e pré-carregados. O .play() é chamado dentro da interação do usuário.
        const sfx = {
            bgm: new Audio('https://actions.google.com/sounds/v1/science_fiction/glitchy_digital_opening.ogg'),
            cook: new Audio('https://actions.google.com/sounds/v1/water/liquid_simmering_loop.ogg'),
            success: new Audio('https://actions.google.com/sounds/v1/cartoon/clime_bing_bing.ogg'),
            fail: new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg'),
            nitro: new Audio('https://actions.google.com/sounds/v1/transportation/car_passing_by.ogg'),
            chop: new Audio('https://actions.google.com/sounds/v1/foley/squeaky_toy_press.ogg')
        };
        
        sfx.bgm.loop = true; sfx.bgm.volume = 0.4;
        sfx.cook.loop = true; sfx.cook.volume = 0.6;
        sfx.success.volume = 0.5;

        // Função auxiliar para tocar som sem erro
        function playSound(sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Audio prevent:", e));
        }

        // --- VARIÁVEIS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Emojis para os pratos
        const DISHES = [
            { id: 1, icon: "🍔", time: 2000 }, { id: 2, icon: "🍕", time: 2500 },
            { id: 3, icon: "🍣", time: 1500 }, { id: 4, icon: "🥗", time: 1000 },
            { id: 5, icon: "🍜", time: 3000 }, { id: 6, icon: "🌮", time: 1800 },
            { id: 7, icon: "🥩", time: 3500 }, { id: 8, icon: "🍦", time: 500 },
            { id: 9, icon: "🍰", time: 2200 }, { id: 10, icon: "🍤", time: 1200 }
        ];

        let myId = 'p' + Math.floor(Math.random()*9999);
        let roomId = null, isHost = false;
        let players = {}, customers = {};
        let score = 0, lostCount = 0;
        
        // Controles
        let joystick = { active: false, dx: 0, dy: 0, angle: 0 };
        let actionHeld = false, cookTimer = 0, currentStation = null;
        let layout = { stations: [], tables: [] };
        let isBoosting = false, boostCooldown = false;

        // --- MENU & START ---
        document.getElementById('create-btn').onclick = () => start(true);
        document.getElementById('join-btn').onclick = () => start(false);

        async function start(hostStatus) {
            const name = document.getElementById('username').value.trim() || "Chef " + Math.floor(Math.random()*100);
            const inputRoom = document.getElementById('room-input').value.trim().toUpperCase();
            
            // Tenta destravar áudio no clique inicial
            sfx.bgm.play().catch(e => console.log("Browser bloqueou autoplay"));

            if(hostStatus) {
                // Gera código de sala amigável (Letras)
                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                roomId = "";
                for(let i=0; i<5; i++) roomId += chars.charAt(Math.floor(Math.random() * chars.length));
                
                await set(ref(db, `rooms/${roomId}`), { 
                    score: 0, lostCount: 0, difficulty: 1, 
                    hostId: myId, startTime: Date.now() 
                });
            } else {
                if(inputRoom.length < 3) return alert("Digite um código de sala válido!");
                roomId = inputRoom;
                const snap = await get(ref(db, `rooms/${roomId}`));
                if(!snap.exists()) return alert("Sala não encontrada!");
            }

            // ATUALIZA O DISPLAY DA SALA
            document.getElementById('room-display').innerText = `SALA: ${roomId}`;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-container').style.display = 'block';
            
            initGame(name);
        }

        function initGame(name) {
            resize();
            const myRef = ref(db, `rooms/${roomId}/players/${myId}`);
            // Cor agora serve para o "círculo base" abaixo do pinguim
            set(myRef, { 
                name, x: canvas.width/2, y: canvas.height/2, 
                color: `hsl(${Math.random()*360}, 70%, 50%)`, 
                holding: null, dir: 1 
            });
            onDisconnect(myRef).remove();

            // Listener Global
            onValue(ref(db, `rooms/${roomId}`), (snap) => {
                const data = snap.val();
                if(!data) {
                     // Sala fechada ou deletada
                    return; 
                }
                players = data.players || {};
                customers = data.customers || {};
                score = data.score || 0;
                
                // Sons de evento
                if((data.lostCount || 0) > lostCount) playSound(sfx.fail);
                lostCount = data.lostCount || 0;
                
                document.getElementById('score').innerText = score;
                document.getElementById('lost-count').innerText = lostCount;
                
                if(lostCount >= 5) {
                    document.getElementById('game-over').style.display = 'flex';
                    sfx.bgm.pause();
                }
            });

            if(isHost) setInterval(updateHostLogic, 1000);
            requestAnimationFrame(loop);
        }

        function updateHostLogic() {
            const roomRef = ref(db, `rooms/${roomId}`);
            get(roomRef).then(snap => {
                if(!snap.exists()) return;
                const data = snap.val();
                
                // Dificuldade aumenta com o tempo
                const timeElapsed = (Date.now() - data.startTime) / 1000;
                const diff = 1 + Math.floor(timeElapsed / 45) * 0.3;
                
                // Gerar Clientes
                const maxCustomers = 3 + Math.floor(diff/2);
                if(Object.keys(customers).length < maxCustomers && Math.random() > (0.7 - (diff*0.05))) {
                    const table = layout.tables[Math.floor(Math.random()*layout.tables.length)];
                    // Verifica se mesa está vazia
                    if(!Object.values(customers).some(c => c.tableId === table.id)) {
                        push(ref(db, `rooms/${roomId}/customers`), { 
                            tableId: table.id, 
                            wanted: Math.floor(Math.random()*DISHES.length)+1, 
                            patience: 100 
                        });
                        // playSound(sfx.chop); // Som de cliente chegando (opcional)
                    }
                }

                // Atualizar Paciência
                let updates = {};
                let gameOverTrigger = false;
                
                Object.keys(customers).forEach(key => {
                    const c = customers[key];
                    const p = c.patience - (2.5 * diff); // Decaimento
                    
                    if(p <= 0) {
                        updates[`customers/${key}`] = null; // Remove
                        updates['lostCount'] = (data.lostCount || 0) + 1;
                    } else {
                        updates[`customers/${key}/patience`] = p;
                    }
                });
                
                if(Object.keys(updates).length > 0) update(roomRef, updates);
            });
        }

        // --- CONTROLES & INTERAÇÃO ---
        const boostBtn = document.getElementById('boost-btn');
        boostBtn.onclick = () => {
            if(boostCooldown || isBoosting) return;
            isBoosting = true; 
            playSound(sfx.nitro);
            boostBtn.classList.add('disabled');
            
            setTimeout(() => { 
                isBoosting = false; 
                boostCooldown = true; 
                setTimeout(() => { boostCooldown = false; boostBtn.classList.remove('disabled'); }, 8000);
            }, 3000); // 3s de boost
        };

        const joyZone = document.getElementById('joystick-zone');
        const joyNub = document.getElementById('joystick-nub');
        
        joyZone.ontouchstart = (e) => { e.preventDefault(); joystick.active = true; };
        window.ontouchmove = (e) => {
            if(!joystick.active) return;
            const t = e.touches[0]; 
            const r = joyZone.getBoundingClientRect();
            const cx = r.left + r.width/2; 
            const cy = r.top + r.height/2;
            
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.hypot(dx, dy);
            const max = r.width/2;
            
            if(dist > max) { dx *= max/dist; dy *= max/dist; }
            
            joystick.dx = dx/max; 
            joystick.dy = dy/max;
            joyNub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        };
        
        window.ontouchend = () => { 
            joystick.active = false; joystick.dx = 0; joystick.dy = 0; 
            joyNub.style.transform = `translate(-50%, -50%)`; 
        };

        const actBtn = document.getElementById('action-btn');
        actBtn.ontouchstart = (e) => { 
            e.preventDefault(); 
            actionHeld = true; 
            // Garante que o som de cozinha possa tocar
            if(sfx.cook.paused) sfx.cook.load();
        };
        actBtn.ontouchend = () => { 
            actionHeld = false; cookTimer = 0; currentStation = null; 
            sfx.cook.pause(); 
            sfx.chop.currentTime = 0; // Reset
        };

        // --- RENDER ---
        function resize() {
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            
            const gridSize = Math.min(canvas.width, canvas.height) / 8;
            
            // Layout das Estações (Topo)
            layout.stations = [];
            for(let i=0; i<DISHES.length; i++) {
                layout.stations.push({ 
                    x: (canvas.width / (DISHES.length + 1)) * (i+1), 
                    y: gridSize, 
                    dish: DISHES[i], 
                    size: gridSize * 0.8 
                });
            }
            
            // Layout das Mesas (Fundo)
            layout.tables = [];
            const cols = 2; const rows = 2;
            for(let i=0; i<4; i++) {
                layout.tables.push({ 
                    id: i, 
                    x: (canvas.width / 3) * ((i%2)+1), 
                    y: canvas.height * 0.5 + (Math.floor(i/2) * gridSize * 1.5), 
                    size: gridSize 
                });
            }
        }
        window.onresize = resize;

        function loop() {
            // Fundo
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Chão Cozinha
            ctx.fillStyle = "#353b48"; 
            ctx.fillRect(0,0, canvas.width, canvas.height * 0.35);
            // Piso Restaurante (Xadrez sutil)
            ctx.fillStyle = "#7f8c8d"; 
            ctx.fillRect(0, canvas.height * 0.35, canvas.width, canvas.height * 0.65);
            
            // Divisória Balcão
            ctx.fillStyle = "#2f3640";
            ctx.fillRect(0, canvas.height * 0.34, canvas.width, 10);

            // 1. DESENHAR ESTAÇÕES
            layout.stations.forEach(s => {
                // Bancada
                ctx.fillStyle = "#dcdde1"; 
                ctx.fillRect(s.x - s.size/2, s.y - s.size/2, s.size, s.size);
                ctx.strokeStyle = "#718093"; ctx.lineWidth = 4;
                ctx.strokeRect(s.x - s.size/2, s.y - s.size/2, s.size, s.size);
                
                // Icone
                ctx.font = `${s.size * 0.6}px Arial`; 
                ctx.textAlign = "center"; 
                ctx.textBaseline = "middle";
                ctx.fillText(s.dish.icon, s.x, s.y);
            });

            // 2. DESENHAR MESAS
            layout.tables.forEach(t => {
                // Cadeira e Mesa
                ctx.fillStyle = "#e1b12c"; 
                ctx.beginPath(); ctx.arc(t.x, t.y, t.size/2, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#c23616"; ctx.lineWidth = 4; ctx.stroke();
                
                // Cliente
                const cust = Object.values(customers).find(c => c.tableId === t.id);
                if(cust) {
                    // Barra de Paciência
                    const barW = t.size;
                    const barH = 8;
                    ctx.fillStyle = "black"; ctx.fillRect(t.x - barW/2, t.y - t.size, barW, barH);
                    
                    const pct = cust.patience/100;
                    ctx.fillStyle = pct > 0.5 ? "#4cd137" : (pct > 0.2 ? "orange" : "red");
                    ctx.fillRect(t.x - barW/2 + 1, t.y - t.size + 1, (barW-2) * pct, barH - 2);
                    
                    // Pedido (Balão)
                    ctx.fillStyle = "white"; 
                    ctx.beginPath(); ctx.arc(t.x + t.size/2, t.y - t.size/2, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "black";
                    ctx.font = "20px Arial";
                    const dishIcon = DISHES.find(d => d.id === cust.wanted)?.icon || "?";
                    ctx.fillText(dishIcon, t.x + t.size/2, t.y - t.size/2);
                }
            });

            // 3. LÓGICA DO JOGADOR LOCAL
            const me = players[myId];
            if(me && lostCount < 5) {
                if(joystick.active) {
                    const spd = isBoosting ? 12 : 6;
                    me.x += joystick.dx * spd; 
                    me.y += joystick.dy * spd;
                    
                    // Limites da tela
                    me.x = Math.max(20, Math.min(canvas.width-20, me.x));
                    me.y = Math.max(20, Math.min(canvas.height-20, me.y));

                    // Atualiza no Firebase
                    update(ref(db, `rooms/${roomId}/players/${myId}`), { x: me.x, y: me.y });
                }

                // Ação (Cozinhar ou Entregar)
                if(actionHeld) {
                    // Cozinhando?
                    const station = layout.stations.find(s => Math.hypot(me.x-s.x, me.y-s.y) < s.size);
                    if(station && !me.holding) {
                        currentStation = station; 
                        cookTimer += (isBoosting ? 35 : 17); // ~1s a 2s
                        
                        if(sfx.cook.paused) sfx.cook.play();
                        
                        if(cookTimer >= station.dish.time) {
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: station.dish.id });
                            playSound(sfx.chop); // Som de "Pronto"
                            actionHeld = false; sfx.cook.pause();
                        }
                    } else {
                        sfx.cook.pause();
                        cookTimer = 0;
                    }

                    // Entregando?
                    const table = layout.tables.find(t => Math.hypot(me.x-t.x, me.y-t.y) < t.size);
                    if(table && me.holding) {
                        const cKey = Object.keys(customers).find(k => customers[k].tableId === table.id);
                        if(cKey && customers[cKey].wanted === me.holding) {
                            // ENTREGA SUCESSO
                            runTransaction(ref(db, `rooms/${roomId}/score`), s => (s || 0) + 100);
                            remove(ref(db, `rooms/${roomId}/customers/${cKey}`));
                            update(ref(db, `rooms/${roomId}/players/${myId}`), { holding: null });
                            actionHeld = false; 
                            playSound(sfx.success);
                        }
                    }
                } else {
                    sfx.cook.pause();
                }
            }

            // 4. DESENHAR JOGADORES (Pinguins)
            Object.values(players).forEach(p => {
                // Sombra/Base colorida
                ctx.fillStyle = p.color; 
                ctx.beginPath(); ctx.ellipse(p.x, p.y + 15, 20, 10, 0, 0, Math.PI*2); ctx.fill();
                
                // CORPO DO PINGUIM (Emoji)
                ctx.font = "45px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // Inverte o emoji se estiver andando para esquerda (opcional, complexo com emoji puro, mantendo simples)
                ctx.fillText("🐧", p.x, p.y);

                // NOME
                ctx.fillStyle = "white"; 
                ctx.font = "bold 14px Segoe UI"; 
                ctx.strokeStyle = "black"; ctx.lineWidth = 3;
                ctx.strokeText(p.name, p.x, p.y - 35);
                ctx.fillText(p.name, p.x, p.y - 35);

                // ITEM SEGURADO (Sobre a cabeça)
                if(p.holding) {
                    const dish = DISHES.find(d => d.id === p.holding);
                    if(dish) {
                        // Fundo branco bolinha pro item
                        ctx.fillStyle = "rgba(255,255,255,0.8)";
                        ctx.beginPath(); ctx.arc(p.x + 15, p.y - 20, 15, 0, Math.PI*2); ctx.fill();
                        
                        ctx.font = "24px Arial";
                        ctx.fillText(dish.icon, p.x + 15, p.y - 20);
                    }
                }

                // BARRA DE COZINHAR (Apenas para o player local e ativo)
                if(p.name === me?.name && actionHeld && currentStation) {
                    const barW = 60;
                    ctx.fillStyle = "white"; ctx.fillRect(p.x - barW/2, p.y - 50, barW, 8);
                    ctx.fillStyle = "#f1c40f"; 
                    const prog = Math.min(1, cookTimer/currentStation.dish.time);
                    ctx.fillRect(p.x - barW/2, p.y - 50, barW * prog, 8);
                }
            });

            requestAnimationFrame(loop);
        }
    </script>
</body>
    </html>
