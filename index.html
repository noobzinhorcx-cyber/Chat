<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-EMOJI ULTIMATE ONLINE</title>
    <style>
        :root { --p-color: #00ff00; }
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; user-select: none; }
        
        /* Telas de Menu */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: 0.5s; }
        input { padding: 12px; margin: 10px; border-radius: 5px; border: 1px solid var(--p-color); background: #222; color: #fff; width: 250px; text-align: center; }
        button { padding: 12px 25px; margin: 5px; cursor: pointer; background: var(--p-color); border: none; font-weight: bold; border-radius: 5px; width: 275px; color: #000; }
        button:hover { background: #00cc00; transform: scale(1.05); }

        /* Jogo */
        #game-world { position: absolute; width: 3000px; height: 3000px; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transform: translate(0,0); }
        .entity { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; transform: translate(-50%, -50%); transition: transform 0.1s linear; pointer-events: none; }
        .player-label { position: absolute; top: -20px; font-size: 10px; white-space: nowrap; color: #0f0; width: 100%; text-align: center; }
        
        /* UI de Combate */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; pointer-events: none; text-shadow: 2px 2px #000; }
        .stat-box { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid var(--p-color); margin-bottom: 5px; border-radius: 0 5px 5px 0; }
        
        /* Chat */
        #chat-area { position: fixed; bottom: 180px; left: 20px; width: 300px; z-index: 500; }
        #chat-log { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; display: flex; flex-direction: column-reverse; }
        #chat-input { width: 100%; box-sizing: border-box; background: rgba(50,50,50,0.8); border: 1px solid #555; padding: 8px; color: #fff; border-radius: 5px; }

        /* Controles */
        .joy-container { position: fixed; bottom: 30px; width: 140px; height: 140px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); touch-action: none; z-index: 900; }
        #move-joy { left: 30px; }
        #shoot-joy { right: 30px; border-color: rgba(255,0,0,0.2); }
        .stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; top: 40px; left: 40px; }
        
        .bullet { position: absolute; font-size: 15px; z-index: 10; pointer-events: none; }
        .xp-bar-container { position: fixed; top: 0; left: 0; width: 100%; height: 5px; background: #222; }
        #xp-bar-fill { height: 100%; width: 0%; background: #ffcc00; transition: 0.3s; }
    </style>
</head>
<body>

<div class="xp-bar-container"><div id="xp-bar-fill"></div></div>

<div id="menu-screen" class="overlay">
    <h1 style="font-size: 3em; color: var(--p-color);">🧟 Z-EMOJI.IO</h1>
    <input type="text" id="player-name" placeholder="Apelido..." maxlength="12">
    <button onclick="initGame('public')">JOGAR PARTIDA PÚBLICA</button>
    <button onclick="showPrivateMenu()" style="background:#555">PARTIDA PRIVADA</button>
</div>

<div id="private-menu" class="overlay" style="display:none">
    <h2>SALA PRIVADA</h2>
    <input type="text" id="room-code" placeholder="Código da Sala">
    <button onclick="initGame('create-private')">CRIAR SALA</button>
    <button onclick="initGame('join-private')">ENTRAR NA SALA</button>
    <button onclick="backToMenu()" style="background:#444">VOLTAR</button>
</div>

<div id="lobby-screen" class="overlay" style="display:none">
    <h2 id="lobby-status">Aguardando Sobreviventes...</h2>
    <div style="font-size: 40px; margin: 20px;" id="timer-display">50</div>
    <p id="room-id-tag"></p>
    <div id="player-list-lobby"></div>
</div>

<div id="hud">
    <div class="stat-box">
        <div id="gun-display">👊 Soco Nível 1</div>
        <div id="kill-display">Kills: 0</div>
    </div>
    <div class="stat-box">
        <div id="hp-display">❤️❤️❤️</div>
    </div>
</div>

<div id="chat-area">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Pressione Enter para falar... (/Cor red)">
</div>

<div id="game-world">
    <div id="entities-layer"></div>
</div>

<div id="move-joy" class="joy-container"><div class="stick" id="move-stick"></div></div>
<div id="shoot-joy" class="joy-container"><div class="stick" id="shoot-stick"></div></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, push, update, onDisconnect, remove, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    // --- CONFIGURAÇÃO ---
    const firebaseConfig = {
        apiKey: "AIzaSyCv-psEkDV_yJ4KFcoF5OsN2nWi8rPzI7Q", // Use sua chave real aqui
        authDomain: "chatrucoy.firebaseapp.com",
        databaseURL: "https://chatrucoy-default-rtdb.firebaseio.com",
        projectId: "chatrucoy"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- CONSTANTES DO JOGO ---
    const WEAPONS = [
        {n: "👊 Soco", d: 1, s: 200}, {n: "🔪 Faca", d: 2, s: 250}, {n: "🏏 Taco", d: 3, s: 300},
        {n: "🪓 Machado", d: 5, s: 400}, {n: "🔫 Glock", d: 4, s: 600}, {n: "🔫 Uzi", d: 3, s: 800},
        {n: "🔫 Ak-47", d: 6, s: 700}, {n: "🔫 Sniper", d: 15, s: 1000}, {n: "🔥 Lança-chamas", d: 2, s: 900},
        {n: "⚡ Laser", d: 8, s: 1200}, {n: "💣 Granada", d: 20, s: 500}, {n: "🏹 Arco", d: 7, s: 650},
        {n: "🔱 Tridente", d: 10, s: 750}, {n: "⚔️ Katana", d: 12, s: 850}, {n: "🧨 Dinamite", d: 25, s: 400},
        {n: "🤜 Boxe", d: 9, s: 350}, {n: "🛰️ Satélite", d: 30, s: 1500}, {n: "🌟 Estrela", d: 18, s: 900},
        {n: "☄️ Meteoro", d: 40, s: 1800}, {n: "👑 Cajado Real", d: 100, s: 2000}
    ];

    const ZOMBIE_TYPES = [
        "🧟", "🧟‍♂️", "🧟‍♀️", "💀", "👻", "🧛", "👽", "👹", "🤡", "👺", "🎃", "🤖", "🦂", "🐍", "🐺", "🕷️", "🦟", "🐗", 
        "🐲", "👾" // Bosses: 🐲 (Vida alta), 👾 (Teleporte aleatório)
    ];

    // --- ESTADO GLOBAL ---
    let myId = "P_" + Math.random().toString(36).substr(2, 5);
    let roomID = "";
    let isHost = false;
    let gameState = 'MENU'; // MENU, LOBBY, PLAYING
    let myData = {
        x: 1500, y: 1500, hp: 5, kills: 0, 
        weaponIdx: 0, nick: "Noob", color: "#fff",
        vx: 0, vy: 0, angle: 0
    };
    
    let players = {};
    let zombies = {};
    let items = {};
    let bullets = [];
    let lastShootTime = 0;

    // --- SISTEMA DE CÂMERA ---
    function updateCamera() {
        const camX = window.innerWidth / 2 - myData.x;
        const camY = window.innerHeight / 2 - myData.y;
        document.getElementById('game-world').style.transform = `translate(${camX}px, ${camY}px)`;
    }

    // --- SISTEMA DE SALAS ---
    window.initGame = async (mode) => {
        const nickInput = document.getElementById('player-name').value;
        myData.nick = nickInput || "Emoji_" + Math.random().toString(36).substr(2,3);
        
        if(mode === 'public') {
            roomID = "PUB_MAP_1"; 
        } else if(mode === 'create-private') {
            roomID = "PRIV_" + Math.random().toString(36).substr(2,5).toUpperCase();
        } else {
            roomID = document.getElementById('room-code').value.toUpperCase();
        }

        document.querySelectorAll('.overlay').forEach(e => e.style.display = 'none');
        document.getElementById('lobby-screen').style.display = 'flex';
        document.getElementById('room-id-tag').innerText = "CÓDIGO: " + roomID;
        
        joinFirebaseRoom();
    };

    function joinFirebaseRoom() {
        const roomRef = ref(db, `rooms/${roomID}`);
        
        // Verifica se é host
        get(ref(db, `rooms/${roomID}/host`)).then(snap => {
            if(!snap.exists()) {
                set(ref(db, `rooms/${roomID}/host`), myId);
                isHost = true;
                startLobbyTimer();
            }
        });

        // Sync Player
        set(ref(db, `rooms/${roomID}/players/${myId}`), myData);
        onDisconnect(ref(db, `rooms/${roomID}/players/${myId}`)).remove();

        // Listeners
        onValue(ref(db, `rooms/${roomID}/status`), (snap) => {
            if(snap.val() === 'STARTED') startGame();
        });

        onValue(ref(db, `rooms/${roomID}/players`), (snap) => {
            players = snap.val() || {};
            renderPlayers();
        });

        onValue(ref(db, `rooms/${roomID}/zombies`), (snap) => {
            zombies = snap.val() || {};
            renderZombies();
        });

        onValue(ref(db, `rooms/${roomID}/items`), (snap) => {
            items = snap.val() || {};
            renderItems();
        });

        onValue(ref(db, `rooms/${roomID}/chat`), (snap) => {
            updateChatUI(snap.val());
        });
    }

    function startLobbyTimer() {
        let count = 50;
        const itv = setInterval(() => {
            count--;
            update(ref(db, `rooms/${roomID}`), { timer: count });
            if(count <= 0) {
                clearInterval(itv);
                set(ref(db, `rooms/${roomID}/status`), 'STARTED');
            }
        }, 1000);
        
        onValue(ref(db, `rooms/${roomID}/timer`), (snap) => {
            document.getElementById('timer-display').innerText = snap.val() || 50;
        });
    }

    function startGame() {
        gameState = 'PLAYING';
        document.getElementById('lobby-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('lobby-screen').style.display = 'none', 500);
        
        if(isHost) {
            spawnInitialZombies();
            setInterval(hostLogic, 2000); // Lógica de IA só roda no Host
        }
        
        requestAnimationFrame(gameLoop);
    }

    // --- GAME ENGINE ---
    function gameLoop() {
        if(gameState !== 'PLAYING') return;

        // Movimentação
        myData.x += myData.vx * 6;
        myData.y += myData.vy * 6;

        // Limites do mapa
        myData.x = Math.max(0, Math.min(3000, myData.x));
        myData.y = Math.max(0, Math.min(3000, myData.y));

        updateCamera();
        syncPosition();
        processBullets();
        checkCollisions();
        
        requestAnimationFrame(gameLoop);
    }

    function syncPosition() {
        update(ref(db, `rooms/${roomID}/players/${myId}`), {
            x: myData.x, y: myData.y, kills: myData.kills, weaponIdx: myData.weaponIdx
        });
    }

    // --- TIROS E ARMAS ---
    function shoot(tx, ty) {
        const now = Date.now();
        const weapon = WEAPONS[myData.weaponIdx];
        if(now - lastShootTime < (2000 - weapon.s)) return;
        
        lastShootTime = now;
        const angle = Math.atan2(ty, tx);
        const bId = "B_" + now;
        
        const bData = {
            id: bId,
            x: myData.x, y: myData.y,
            vx: Math.cos(angle) * 15,
            vy: Math.sin(angle) * 15,
            owner: myId,
            dist: 0
        };
        
        bullets.push(bData);
        createBulletElement(bData);
    }

    function createBulletElement(b) {
        const el = document.createElement('div');
        el.id = b.id;
        el.className = 'bullet';
        el.innerText = '⏺️';
        document.getElementById('game-world').appendChild(el);
    }

    function processBullets() {
        bullets.forEach((b, index) => {
            b.x += b.vx;
            b.y += b.vy;
            b.dist += 15;

            const el = document.getElementById(b.id);
            if(el) {
                el.style.left = b.x + 'px';
                el.style.top = b.y + 'px';
            }

            // Colisão com Zumbis (Localmente para feedback rápido)
            Object.keys(zombies).forEach(zId => {
                const z = zombies[zId];
                const d = Math.hypot(b.x - z.x, b.y - z.y);
                if(d < 30) {
                    hitZombie(zId);
                    destroyBullet(index);
                }
            });

            if(b.dist > 800) destroyBullet(index);
        });
    }

    function destroyBullet(idx) {
        const b = bullets[idx];
        if(b) {
            const el = document.getElementById(b.id);
            if(el) el.remove();
            bullets.splice(idx, 1);
        }
    }

    // --- ZOMBIES E IA (HOST ONLY) ---
    function spawnInitialZombies() {
        for(let i=0; i<30; i++) spawnZombie();
    }

    function spawnZombie() {
        const zId = "Z_" + Math.random().toString(36).substr(2, 6);
        const typeIdx = Math.floor(Math.random() * ZOMBIE_TYPES.length);
        const x = Math.random() * 3000;
        const y = Math.random() * 3000;
        
        set(ref(db, `rooms/${roomID}/zombies/${zId}`), {
            x, y, type: ZOMBIE_TYPES[typeIdx], hp: (typeIdx + 1) * 2
        });
    }

    function hostLogic() {
        // Mover zumbis em direção ao player mais próximo
        Object.keys(zombies).forEach(zId => {
            let target = null;
            let minDist = 1000;

            Object.values(players).forEach(p => {
                const d = Math.hypot(p.x - zombies[zId].x, p.y - zombies[zId].y);
                if(d < minDist) {
                    minDist = d;
                    target = p;
                }
            });

            if(target) {
                const angle = Math.atan2(target.y - zombies[zId].y, target.x - zombies[zId].x);
                const nx = zombies[zId].x + Math.cos(angle) * 15;
                const ny = zombies[zId].y + Math.sin(angle) * 15;
                update(ref(db, `rooms/${roomID}/zombies/${zId}`), { x: nx, y: ny });
            }
        });

        // Spawn de cura aleatória
        if(Math.random() > 0.8) {
            const iId = "IT_" + Date.now();
            set(ref(db, `rooms/${roomID}/items/${iId}`), {
                x: Math.random() * 2800 + 100, y: Math.random() * 2800 + 100, type: "💊"
            });
        }
    }

    function hitZombie(zId) {
        const zRef = ref(db, `rooms/${roomID}/zombies/${zId}`);
        get(zRef).then(snap => {
            if(!snap.exists()) return;
            let z = snap.val();
            z.hp -= WEAPONS[myData.weaponIdx].d;
            
            if(z.hp <= 0) {
                remove(zRef);
                myData.kills++;
                updateProgress();
                if(isHost) spawnZombie(); // Repor zumbi
            } else {
                update(zRef, { hp: z.hp });
            }
        });
    }

    function updateProgress() {
        const nextLevel = (myData.weaponIdx + 1) * 5;
        document.getElementById('kill-display').innerText = `Kills: ${myData.kills}`;
        document.getElementById('xp-bar-fill').style.width = (myData.kills / 100 * 100) + "%";

        if(myData.kills >= nextLevel && myData.weaponIdx < 19) {
            myData.weaponIdx++;
            document.getElementById('gun-display').innerText = WEAPONS[myData.weaponIdx].n + " Nível " + (myData.weaponIdx + 1);
        }
    }

    // --- RENDERIZAÇÃO ---
    function renderPlayers() {
        const layer = document.getElementById('entities-layer');
        Object.keys(players).forEach(id => {
            if(id === myId) {
                updateHUD();
                return;
            }
            let pEl = document.getElementById(id);
            if(!pEl) {
                pEl = document.createElement('div');
                pEl.id = id;
                pEl.className = 'entity';
                pEl.innerHTML = `<div class="player-label">${players[id].nick}</div>👤`;
                layer.appendChild(pEl);
            }
            pEl.style.left = players[id].x + 'px';
            pEl.style.top = players[id].y + 'px';
        });
        
        // Remover desconectados
        document.querySelectorAll('.entity').forEach(el => {
            if(el.id.startsWith('P_') && el.id !== myId && !players[el.id]) el.remove();
        });
    }

    function renderZombies() {
        const layer = document.getElementById('entities-layer');
        Object.keys(zombies).forEach(zId => {
            let zEl = document.getElementById(zId);
            if(!zEl) {
                zEl = document.createElement('div');
                zEl.id = zId;
                zEl.className = 'entity';
                zEl.innerText = zombies[zId].type;
                layer.appendChild(zEl);
            }
            zEl.style.left = zombies[zId].x + 'px';
            zEl.style.top = zombies[zId].y + 'px';
        });

        document.querySelectorAll('.entity').forEach(el => {
            if(el.id.startsWith('Z_') && !zombies[el.id]) el.remove();
        });
    }

    function renderItems() {
        const layer = document.getElementById('entities-layer');
        Object.keys(items).forEach(iId => {
            let iEl = document.getElementById(iId);
            if(!iEl) {
                iEl = document.createElement('div');
                iEl.id = iId;
                iEl.className = 'entity';
                iEl.innerText = items[iId].type;
                layer.appendChild(iEl);
            }
            iEl.style.left = items[iId].x + 'px';
            iEl.style.top = items[iId].y + 'px';
            
            // Colisão com cura
            const d = Math.hypot(myData.x - items[iId].x, myData.y - items[iId].y);
            if(d < 40 && myData.hp < 5) {
                myData.hp++;
                remove(ref(db, `rooms/${roomID}/items/${iId}`));
            }
        });
    }

    function updateHUD() {
        document.getElementById('hp-display').innerText = "❤️".repeat(myData.hp);
    }

    function checkCollisions() {
        // Colisão Jogador vs Zumbi
        Object.values(zombies).forEach(z => {
            const d = Math.hypot(myData.x - z.x, myData.y - z.y);
            if(d < 40) {
                // Knockback simples e dano
                const angle = Math.atan2(myData.y - z.y, myData.x - z.x);
                myData.x += Math.cos(angle) * 50;
                myData.y += Math.sin(angle) * 50;
                myData.hp--;
                if(myData.hp <= 0) location.reload(); // Game Over simples
            }
        });
    }

    // --- CONTROLES E CHAT ---
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') {
            const text = chatInput.value;
            if(text.startsWith('/Cor ')) {
                myData.color = text.split(' ')[1];
            } else {
                push(ref(db, `rooms/${roomID}/chat`), {
                    sender: myData.nick,
                    msg: text,
                    color: myData.color
                });
            }
            chatInput.value = "";
            chatInput.blur();
        }
    });

    function updateChatUI(data) {
        if(!data) return;
        const log = document.getElementById('chat-log');
        log.innerHTML = "";
        Object.values(data).reverse().forEach(m => {
            const div = document.createElement('div');
            div.style.color = m.color;
            div.innerHTML = `<b>${m.sender}:</b> ${m.msg}`;
            log.appendChild(div);
        });
    }

    function setupJoy(id, stickId, callback) {
        const container = document.getElementById(id);
        const stick = document.getElementById(stickId);
        let active = false;

        const handleMove = (e) => {
            if(!active) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = container.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const max = 50;
            if(dist > max) { dx *= max/dist; dy *= max/dist; }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            callback(dx/max, dy/max);
        };

        container.addEventListener('touchstart', () => active = true);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', () => {
            active = false;
            stick.style.transform = `translate(0,0)`;
            callback(0,0);
        });
    }

    setupJoy('move-joy', 'move-stick', (x, y) => {
        myData.vx = x; myData.vy = y;
    });

    setupJoy('shoot-joy', 'shoot-stick', (x, y) => {
        if(x !== 0 || y !== 0) shoot(x, y);
    });

    window.showPrivateMenu = () => {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('private-menu').style.display = 'flex';
    };

    window.backToMenu = () => {
        document.getElementById('private-menu').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'flex';
    };

</script>
</body>
    </html>
